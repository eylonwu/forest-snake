<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#05070f" />
  <title>霓虹贪吃蛇 · Neon Snake</title>
  <style>
    :root {
      --bg: #05070f;
      --ink: #0a0f24;
      --card-a: #1b2454;
      --card-b: #101636;
      --line: rgba(110, 225, 255, 0.2);
      --cyan: #48f0d4;
      --violet: #8a6bff;
      --pink: #ff5fb0;
      --gold: #ffd15c;
      --text: #eaf4ff;
      --muted: #8ea2c4;
      --ui: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
      --display: "Trebuchet MS", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    html { background: #05070f; }

    body {
      margin: 0;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px 12px;
      color: var(--text);
      font-family: var(--ui);
      background:
        radial-gradient(900px 620px at 8% -12%, rgba(138, 107, 255, 0.32), transparent 62%),
        radial-gradient(760px 520px at 104% -4%, rgba(72, 240, 212, 0.2), transparent 58%),
        radial-gradient(720px 520px at 50% 112%, rgba(255, 95, 176, 0.16), transparent 60%),
        linear-gradient(180deg, #080c1e 0%, #05070f 72%);
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.5;
      background-image:
        radial-gradient(1.4px 1.4px at 18% 22%, rgba(255, 255, 255, 0.5), transparent 60%),
        radial-gradient(1.2px 1.2px at 72% 14%, rgba(120, 240, 255, 0.55), transparent 60%),
        radial-gradient(1.6px 1.6px at 88% 62%, rgba(255, 145, 210, 0.5), transparent 60%),
        radial-gradient(1.2px 1.2px at 32% 78%, rgba(255, 255, 255, 0.35), transparent 60%),
        radial-gradient(1.3px 1.3px at 56% 44%, rgba(160, 200, 255, 0.4), transparent 60%);
    }

    .app {
      position: relative;
      width: min(100%, 520px);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* ---------- 顶栏 ---------- */

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 2px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: var(--display);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.26em;
      color: #cfeaff;
      text-transform: uppercase;
      text-shadow: 0 0 16px rgba(72, 240, 212, 0.45);
    }

    .brand i {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 12px var(--cyan), 0 0 24px rgba(72, 240, 212, 0.5);
    }

    .coin-pill {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 6px 14px 6px 8px;
      border-radius: 999px;
      background: linear-gradient(180deg, #222c5c, #131a3c);
      border: 1px solid rgba(255, 209, 92, 0.45);
      box-shadow: 0 3px 0 rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.12);
      font-family: var(--display);
      font-size: 14px;
      font-weight: 700;
      color: var(--gold);
      font-variant-numeric: tabular-nums;
    }

    .coin-ico {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: radial-gradient(circle at 34% 28%, #fff4c2, #ffcf4d 48%, #d98f0e 100%);
      box-shadow: inset 0 -2px 0 rgba(120, 70, 0, 0.4), 0 0 10px rgba(255, 209, 92, 0.55);
    }

    /* ---------- HUD ---------- */

    .hud {
      display: grid;
      grid-template-columns: 74px 1fr 74px;
      gap: 8px;
    }

    .hud-card {
      display: flex;
      flex-direction: column;
      gap: 3px;
      padding: 8px 11px;
      border-radius: 14px;
      background: linear-gradient(180deg, var(--card-a), var(--card-b));
      border: 1px solid var(--line);
      box-shadow: 0 3px 0 rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.09);
      min-width: 0;
    }

    .hud-card .k {
      font-size: 10px;
      letter-spacing: 0.16em;
      color: var(--muted);
      white-space: nowrap;
      display: flex;
      justify-content: space-between;
      gap: 6px;
    }

    .hud-card .k b { color: var(--cyan); font-weight: 700; letter-spacing: 0.04em; }

    .hud-card .v {
      font-family: var(--display);
      font-size: 20px;
      font-weight: 700;
      line-height: 1.05;
      font-variant-numeric: tabular-nums;
      color: var(--text);
      text-shadow: 0 0 14px rgba(120, 200, 255, 0.35);
    }

    .hud-bar {
      position: relative;
      height: 7px;
      border-radius: 5px;
      background: rgba(8, 14, 34, 0.85);
      box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.7);
      overflow: hidden;
    }

    .hud-bar i {
      display: block;
      height: 100%;
      width: 0%;
      border-radius: 5px;
      background: linear-gradient(90deg, var(--cyan), #a6ff8f 60%, var(--gold));
      box-shadow: 0 0 12px rgba(72, 240, 212, 0.75);
      transition: width 0.25s ease;
    }

    /* ---------- 棋盘 ---------- */

    .board-wrap {
      position: relative;
      width: min(100%, 520px, max(240px, calc(100dvh - 268px)));
      aspect-ratio: 1 / 1;
      margin: 0 auto;
      border-radius: 22px;
      overflow: hidden;
      background: #070b18;
      box-shadow:
        0 0 0 1px rgba(120, 235, 255, 0.35),
        0 0 0 5px rgba(10, 16, 38, 0.9),
        0 0 26px rgba(72, 240, 212, 0.22),
        0 26px 60px -24px rgba(0, 0, 0, 0.95),
        inset 0 0 70px rgba(0, 0, 0, 0.65);
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: crosshair;
      touch-action: none;
    }

    .glass {
      position: absolute;
      inset: 0;
      z-index: 5;
      pointer-events: none;
      background:
        linear-gradient(140deg, rgba(160, 220, 255, 0.09) 0%, rgba(160, 220, 255, 0.02) 26%, rgba(255, 255, 255, 0) 44%),
        radial-gradient(120% 34% at 50% 0%, rgba(140, 220, 255, 0.07), transparent 62%);
    }

    /* ---------- 覆盖层 ---------- */

    .overlay {
      position: absolute;
      inset: 0;
      z-index: 4;
      display: flex;
      padding: 16px;
      background:
        radial-gradient(circle at 50% 38%, rgba(20, 30, 68, 0.86), rgba(4, 6, 16, 0.96));
      -webkit-backdrop-filter: blur(8px);
      backdrop-filter: blur(8px);
      overflow-y: auto;
      overscroll-behavior: contain;
      transition: opacity 0.22s ease, visibility 0.22s ease;
    }

    .overlay.hidden { opacity: 0; visibility: hidden; pointer-events: none; }

    .ov-inner {
      width: 100%;
      max-width: 392px;
      margin: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 9px;
      text-align: center;
      padding: 4px 0;
    }

    .kicker {
      font-size: 9px;
      letter-spacing: 0.4em;
      color: rgba(120, 240, 255, 0.65);
      text-transform: uppercase;
      text-shadow: 0 0 12px rgba(72, 240, 212, 0.5);
    }

    .ov-inner h1 {
      margin: 0;
      font-family: var(--display);
      font-size: clamp(24px, 6vw, 34px);
      letter-spacing: 0.04em;
      background: linear-gradient(180deg, #ffffff 8%, #8ff5e0 52%, #4fb6ff 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 0 18px rgba(72, 240, 212, 0.4));
    }

    .ov-inner p {
      margin: 0;
      max-width: 34ch;
      font-size: 12.5px;
      line-height: 1.7;
      color: rgba(176, 196, 226, 0.82);
    }

    .chips { display: flex; gap: 7px; flex-wrap: wrap; justify-content: center; margin: 2px 0; }

    .chip {
      display: flex;
      flex-direction: column;
      gap: 1px;
      padding: 6px 13px;
      border-radius: 11px;
      background: linear-gradient(180deg, rgba(38, 50, 96, 0.9), rgba(18, 24, 52, 0.92));
      border: 1px solid rgba(120, 220, 255, 0.16);
      min-width: 68px;
    }

    .chip .ck { font-size: 9.5px; letter-spacing: 0.1em; color: var(--muted); }
    .chip .cv { font-family: var(--display); font-size: 15px; font-weight: 700; color: var(--cyan); }

    .big-stars {
      font-size: 27px;
      letter-spacing: 7px;
      color: rgba(90, 110, 150, 0.45);
      margin: 2px 0 0;
      line-height: 1;
    }

    .big-stars .on {
      color: var(--gold);
      text-shadow: 0 0 16px rgba(255, 209, 92, 0.85), 0 0 34px rgba(255, 170, 40, 0.5);
    }

    /* ---------- 按钮 ---------- */

    .btn-primary {
      margin-top: 8px;
      padding: 13px 36px;
      border: 0;
      border-radius: 15px;
      cursor: pointer;
      font-family: var(--display);
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.06em;
      color: #3a2402;
      background: linear-gradient(180deg, #ffe98f 0%, #ffc545 52%, #f0a017 100%);
      box-shadow:
        0 6px 0 #a4650a,
        0 16px 30px -12px rgba(255, 180, 40, 0.7),
        inset 0 2px 0 rgba(255, 255, 255, 0.8),
        inset 0 -2px 0 rgba(160, 90, 0, 0.35);
      transition: transform 0.1s ease, box-shadow 0.1s ease, filter 0.14s ease;
    }

    .btn-primary:hover { filter: brightness(1.06); }

    .btn-primary:active {
      transform: translateY(4px);
      box-shadow:
        0 2px 0 #a4650a,
        0 8px 16px -10px rgba(255, 180, 40, 0.7),
        inset 0 2px 0 rgba(255, 255, 255, 0.7);
    }

    .btn-row { display: flex; gap: 9px; flex-wrap: wrap; justify-content: center; }

    .btn-ghost {
      padding: 10px 20px;
      border-radius: 13px;
      border: 1px solid rgba(120, 220, 255, 0.28);
      background: linear-gradient(180deg, rgba(40, 54, 104, 0.9), rgba(18, 24, 52, 0.9));
      color: #cfe6ff;
      font-size: 12.5px;
      letter-spacing: 0.05em;
      cursor: pointer;
      box-shadow: 0 3px 0 rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      transition: transform 0.1s ease, border-color 0.15s ease, box-shadow 0.1s ease;
    }

    .btn-ghost:hover { border-color: rgba(120, 240, 255, 0.55); }

    .btn-ghost:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0, 0, 0, 0.45); }

    /* ---------- 关卡格 ---------- */

    .level-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      width: 100%;
      margin: 8px 0 2px;
    }

    .lv {
      position: relative;
      padding: 10px 4px 8px;
      border-radius: 13px;
      border: 1px solid rgba(120, 220, 255, 0.2);
      background: linear-gradient(180deg, #212c60, #131a3e);
      color: var(--text);
      cursor: pointer;
      font-family: var(--display);
      font-size: 16px;
      font-weight: 700;
      line-height: 1.1;
      box-shadow: 0 3px 0 rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      transition: transform 0.1s ease, box-shadow 0.1s ease, border-color 0.12s ease;
    }

    .lv:hover:not(:disabled) {
      transform: translateY(-2px);
      border-color: rgba(120, 240, 255, 0.6);
      box-shadow: 0 5px 0 rgba(0, 0, 0, 0.5), 0 0 18px rgba(72, 240, 212, 0.28), inset 0 1px 0 rgba(255, 255, 255, 0.14);
    }

    .lv .st {
      display: block;
      font-size: 9.5px;
      letter-spacing: 1.5px;
      color: var(--gold);
      margin-top: 3px;
      min-height: 11px;
    }

    .lv.done { border-color: rgba(255, 209, 92, 0.55); }

    .lv:disabled {
      opacity: 0.42;
      cursor: not-allowed;
      background: linear-gradient(180deg, #1a2040, #0e132e);
      box-shadow: 0 3px 0 rgba(0, 0, 0, 0.45);
    }

    /* ---------- 面板 ---------- */

    .panel {
      width: 100%;
      margin-top: 6px;
      padding: 11px 13px;
      border-radius: 14px;
      background: linear-gradient(180deg, rgba(28, 38, 78, 0.72), rgba(12, 17, 40, 0.8));
      border: 1px solid rgba(120, 220, 255, 0.14);
      text-align: left;
    }

    .panel h2 {
      margin: 0 0 8px;
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: 0.18em;
      color: rgba(150, 210, 255, 0.72);
      text-transform: uppercase;
    }

    .mission {
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 12px;
      color: #c7d6ee;
      padding: 4px 0;
    }

    .mission .mname { flex: 1; }

    .mission .mbar {
      width: 64px;
      height: 6px;
      border-radius: 4px;
      background: rgba(6, 10, 26, 0.9);
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.7);
      overflow: hidden;
      flex: 0 0 auto;
    }

    .mission .mbar i {
      display: block;
      height: 100%;
      border-radius: 4px;
      background: linear-gradient(90deg, var(--cyan), #a6ff8f);
      box-shadow: 0 0 8px rgba(72, 240, 212, 0.6);
    }

    .mission.done { color: var(--cyan); }

    .mission .mreward { font-size: 11px; color: var(--gold); min-width: 38px; text-align: right; }

    .shop { display: grid; grid-template-columns: repeat(2, 1fr); gap: 7px; }

    .skin {
      position: relative;
      min-width: 0;
      padding: 8px 6px 7px;
      border-radius: 12px;
      border: 1px solid rgba(120, 220, 255, 0.2);
      background: linear-gradient(180deg, #212c60, #131a3e);
      color: #dbe8ff;
      font-size: 11.5px;
      cursor: pointer;
      line-height: 1.35;
      box-shadow: 0 3px 0 rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.08);
    }

    .skin .sw {
      display: block;
      width: 26px;
      height: 26px;
      margin: 0 auto 5px;
      border-radius: 50%;
      box-shadow: 0 0 12px currentColor, inset 0 -2px 4px rgba(0, 0, 0, 0.45);
    }

    .skin .price { display: block; font-size: 10px; color: var(--gold); margin-top: 2px; }

    .skin.active {
      border-color: rgba(255, 209, 92, 0.8);
      box-shadow: 0 0 0 1px rgba(255, 209, 92, 0.35), 0 0 18px rgba(255, 190, 70, 0.28), 0 3px 0 rgba(0, 0, 0, 0.45);
    }

    .skin:disabled { opacity: 0.45; cursor: not-allowed; }

    /* ---------- 提示与吐司 ---------- */

    .hold-hint {
      position: absolute;
      top: 10px;
      left: 50%;
      z-index: 2;
      padding: 5px 15px;
      border-radius: 999px;
      font-size: 11.5px;
      letter-spacing: 0.08em;
      color: #d6f6ff;
      white-space: nowrap;
      pointer-events: none;
      background: rgba(8, 14, 34, 0.86);
      border: 1px solid rgba(120, 240, 255, 0.32);
      box-shadow: 0 0 16px rgba(72, 240, 212, 0.2);
      opacity: 0;
      transform: translate(-50%, -6px);
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .hold-hint.show { opacity: 1; transform: translate(-50%, 0); }

    .toast {
      position: absolute;
      left: 50%;
      bottom: 14px;
      z-index: 6;
      transform: translate(-50%, 12px);
      padding: 8px 17px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.03em;
      color: #3a2402;
      background: linear-gradient(180deg, #ffe98f, #ffc545);
      box-shadow: 0 4px 0 #a4650a, 0 14px 26px -12px rgba(0, 0, 0, 0.85);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.22s ease, transform 0.22s ease;
      white-space: nowrap;
    }

    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    /* ---------- 底部操作条 ---------- */

    .bar { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }

    .ghost {
      padding: 10px 6px;
      border-radius: 13px;
      border: 1px solid rgba(120, 220, 255, 0.2);
      background: linear-gradient(180deg, rgba(34, 46, 92, 0.92), rgba(14, 20, 44, 0.92));
      color: #cfe0f8;
      font-size: 12.5px;
      letter-spacing: 0.03em;
      cursor: pointer;
      box-shadow: 0 3px 0 rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.08);
      transition: transform 0.1s ease, border-color 0.15s ease, box-shadow 0.1s ease;
    }

    .ghost:hover { border-color: rgba(120, 240, 255, 0.5); }
    .ghost:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0, 0, 0, 0.5); }

    .hint {
      margin: 0;
      text-align: center;
      font-size: 11px;
      letter-spacing: 0.05em;
      color: rgba(142, 162, 196, 0.75);
    }

    @media (max-width: 440px) {
      body { padding: 10px 8px; }
      .app { gap: 8px; }
      .brand { font-size: 11px; letter-spacing: 0.2em; }
      .coin-pill { padding: 5px 11px 5px 7px; font-size: 13px; }
      .hud { grid-template-columns: 62px 1fr 62px; gap: 6px; }
      .hud-card { padding: 7px 9px; border-radius: 12px; }
      .hud-card .v { font-size: 17px; }
      .overlay { padding: 12px; }
      .ov-inner { gap: 7px; }
      .ov-inner h1 { font-size: 23px; }
      .level-grid { gap: 6px; }
      .lv { font-size: 14px; padding: 8px 2px 6px; }
      .skin { font-size: 11px; }
      .btn-primary { padding: 12px 28px; font-size: 15px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand"><i></i> NEON SNAKE</div>
      <div class="coin-pill"><span class="coin-ico"></span><span id="hud-coins">0</span></div>
    </header>

    <div class="hud">
      <div class="hud-card">
        <span class="k">关卡</span>
        <span class="v" id="hud-level">01</span>
      </div>
      <div class="hud-card">
        <span class="k">目标 <b id="hud-goal">0/5</b></span>
        <div class="hud-bar"><i id="hud-bar"></i></div>
      </div>
      <div class="hud-card">
        <span class="k">星星</span>
        <span class="v" id="hud-stars">0</span>
      </div>
    </div>

    <section class="board-wrap">
      <canvas id="game" width="420" height="420" aria-label="霓虹贪吃蛇游戏画面"></canvas>
      <div class="hold-hint" id="hold-hint">已松开 · 按住拖动继续</div>
      <div class="overlay" id="overlay"></div>
      <div class="toast" id="toast"></div>
      <div class="glass"></div>
    </section>

    <div class="bar">
      <button class="ghost" id="restart-btn" type="button">重玩本关</button>
      <button class="ghost" id="select-btn" type="button">选关</button>
      <button class="ghost" id="sound-btn" type="button">音效 开</button>
    </div>

    <p class="hint">按住画面并移动鼠标转向 · 松开暂停 · R 重开 · Esc 选关</p>
  </main>

  <script>
    (() => {
      'use strict';

      const COLS = 21;
      const ROWS = 21;
      const SAVE_KEY = 'neon-snake-save-v4';
      const TAU = Math.PI * 2;

      const LEVELS = [
        { target: 5,  step: 170, rocks: 0 },
        { target: 6,  step: 164, rocks: 0 },
        { target: 7,  step: 159, rocks: 4 },
        { target: 8,  step: 154, rocks: 6 },
        { target: 9,  step: 149, rocks: 8 },
        { target: 10, step: 145, rocks: 10 },
        { target: 11, step: 141, rocks: 12 },
        { target: 12, step: 137, rocks: 14 },
        { target: 13, step: 134, rocks: 16 },
        { target: 14, step: 131, rocks: 18 },
        { target: 15, step: 128, rocks: 20 },
        { target: 18, step: 125, rocks: 22 },
      ];

      const SKINS = [
        {
          id: 'neon', name: '霓虹青蛇', cost: 0,
          hi: [140, 255, 226], lo: [26, 108, 168],
          head: ['#9dfff0', '#31d6c8', '#147aa8'],
          eye: '#eaffff', glow: 'rgba(80, 255, 226, 0.55)', gem: '#5ef2d6',
          swatch: 'linear-gradient(135deg, #9dfff0, #1a7fa8)',
        },
        {
          id: 'candy', name: '糖果粉蛇', cost: 90,
          hi: [255, 176, 220], lo: [128, 40, 122],
          head: ['#ffc9e8', '#ff6fb5', '#a82a80'],
          eye: '#fff2ff', glow: 'rgba(255, 140, 210, 0.55)', gem: '#ff8fd0',
          swatch: 'linear-gradient(135deg, #ffc9e8, #b02f86)',
        },
        {
          id: 'virus', name: '暗紫病毒', cost: 180,
          hi: [186, 134, 255], lo: [38, 16, 74],
          head: ['#c29bff', '#7a45d8', '#371a72'],
          eye: '#d9ff7a', glow: 'rgba(170, 110, 255, 0.55)', gem: '#a97bff',
          swatch: 'linear-gradient(135deg, #c29bff, #371a72)',
        },
        {
          id: 'amber', name: '琥珀金蛇', cost: 260,
          hi: [255, 214, 140], lo: [122, 66, 24],
          head: ['#ffd79a', '#d99a52', '#8a5220'],
          eye: '#fff0b8', glow: 'rgba(255, 200, 110, 0.5)', gem: '#ffc06a',
          swatch: 'linear-gradient(135deg, #ffd79a, #8a5220)',
        },
      ];

      const MISSION_DEFS = [
        { id: 'eggs', label: '吃掉 12 颗能量球', target: 12, reward: 6 },
        { id: 'clears', label: '通关 1 个关卡', target: 1, reward: 8 },
        { id: 'stars', label: '累计获得 6 颗星', target: 6, reward: 10 },
      ];

      const canvas = document.getElementById('game');
      const ctx = canvas.getContext('2d');

      const el = {
        level: document.getElementById('hud-level'),
        goal: document.getElementById('hud-goal'),
        bar: document.getElementById('hud-bar'),
        stars: document.getElementById('hud-stars'),
        coins: document.getElementById('hud-coins'),
        overlay: document.getElementById('overlay'),
        holdHint: document.getElementById('hold-hint'),
        toast: document.getElementById('toast'),
        restartBtn: document.getElementById('restart-btn'),
        selectBtn: document.getElementById('select-btn'),
        soundBtn: document.getElementById('sound-btn'),
      };

      /* ---------------- 存档与留存模型 ---------------- */

      function todayKey(offset = 0) {
        const d = new Date();
        d.setDate(d.getDate() + offset);
        return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
      }

      function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

      function loadSave() {
        const base = {
          unlocked: 1,
          stars: {},
          coins: 0,
          skin: 'neon',
          owned: ['neon'],
          skill: 0.35,
          streak: 0,
          lastDay: '',
          eggs: 0,
          clears: 0,
          runs: 0,
          daily: null,
        };
        try {
          const raw = localStorage.getItem(SAVE_KEY);
          if (!raw) return base;
          const p = JSON.parse(raw) || {};
          const merged = Object.assign(base, p);
          merged.stars = p.stars || {};
          merged.owned = p.owned || ['neon'];
          return merged;
        } catch (_) {
          return base;
        }
      }

      const RET = loadSave();

      function persist() {
        try { localStorage.setItem(SAVE_KEY, JSON.stringify(RET)); } catch (_) {}
      }

      // 连续登录：昨天玩过则 +1，中断重置
      function refreshStreak() {
        const k = todayKey();
        if (RET.lastDay === k) return;
        RET.streak = RET.lastDay === todayKey(-1) ? Math.min(30, (RET.streak || 0) + 1) : 1;
        RET.lastDay = k;
      }

      function streakMultiplier() {
        return 1 + Math.min(RET.streak || 1, 7) * 0.1;
      }

      function refreshDaily() {
        const k = todayKey();
        if (!RET.daily || RET.daily.day !== k) {
          RET.daily = { day: k, progress: { eggs: 0, clears: 0, stars: 0 }, claimed: {} };
        }
      }

      function missionState(def) {
        const p = (RET.daily && RET.daily.progress[def.id]) || 0;
        return { progress: Math.min(p, def.target), done: !!(RET.daily && RET.daily.claimed[def.id]) };
      }

      function addMissionProgress(id, amount) {
        if (!RET.daily) return;
        if (RET.daily.claimed[id]) return;
        RET.daily.progress[id] = (RET.daily.progress[id] || 0) + amount;
        const def = MISSION_DEFS.find((m) => m.id === id);
        if (def && RET.daily.progress[id] >= def.target) {
          RET.daily.claimed[id] = true;
          const gain = Math.round(def.reward * streakMultiplier());
          RET.coins += gain;
          toast('每日任务完成 · +' + gain + ' 金币');
          tone(760, 0.12, 'triangle', 0.09);
          tone(1040, 0.16, 'sine', 0.07, 0.09);
        }
        persist();
      }

      function totalStars() {
        let n = 0;
        for (const k in RET.stars) n += RET.stars[k] || 0;
        return n;
      }

      // 动态难度：表现好微加速，连续失误微减速，保持心流
      function speedFactor() {
        return clamp(1.06 - (RET.skill || 0.35) * 0.12, 0.92, 1.08);
      }

      function currentSkin() {
        return SKINS.find((s) => s.id === RET.skin) || SKINS[0];
      }

      refreshStreak();
      refreshDaily();
      persist();

      /* ---------------- 音效 ---------------- */

      let audio = null;
      let soundOn = true;

      function ensureAudio() {
        if (audio) return audio;
        try {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (AC) audio = new AC();
        } catch (_) { audio = null; }
        return audio;
      }

      function tone(freq, dur, type, vol, delay = 0) {
        if (!soundOn) return;
        const ac = ensureAudio();
        if (!ac) return;
        if (ac.state === 'suspended') ac.resume().catch(() => {});
        const t0 = ac.currentTime + delay;
        const osc = ac.createOscillator();
        const gain = ac.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, t0);
        gain.gain.setValueAtTime(0.0001, t0);
        gain.gain.exponentialRampToValueAtTime(vol, t0 + 0.012);
        gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
        osc.connect(gain).connect(ac.destination);
        osc.start(t0);
        osc.stop(t0 + dur + 0.02);
      }

      function sndEat() {
        const b = 660 + Math.random() * 140;
        tone(b, 0.08, 'triangle', 0.09);
        tone(b * 1.5, 0.12, 'sine', 0.055, 0.032);
      }

      function sndDie() {
        tone(210, 0.3, 'square', 0.09);
        tone(96, 0.46, 'triangle', 0.1, 0.09);
      }

      function sndWin() {
        tone(760, 0.13, 'triangle', 0.09);
        tone(980, 0.14, 'triangle', 0.09, 0.1);
        tone(1280, 0.24, 'sine', 0.08, 0.21);
      }

      /* ---------------- 画布与场景缓存 ---------------- */

      let size = 0;
      let cell = 0;
      let dpr = 1;

      const boardCache = document.createElement('canvas');
      const rockCache = document.createElement('canvas');

      function resizeCanvas() {
        const wrap = canvas.parentElement;
        const w = wrap.clientWidth;
        if (!w) return;
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        size = w;
        cell = size / COLS;
        canvas.width = Math.round(size * dpr);
        canvas.height = Math.round(size * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        buildScenery();
        buildRocks();
      }

      function mulberry32(a) {
        return function () {
          a |= 0;
          a = (a + 0x6D2B79F5) | 0;
          let t = Math.imul(a ^ (a >>> 15), 1 | a);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }

      function buildScenery() {
        const px = Math.max(1, Math.round(size * dpr));
        boardCache.width = px;
        boardCache.height = px;
        const b = boardCache.getContext('2d');
        b.setTransform(dpr, 0, 0, dpr, 0, 0);
        b.clearRect(0, 0, size, size);

        const bg = b.createLinearGradient(0, 0, size * 0.35, size);
        bg.addColorStop(0, '#0d1533');
        bg.addColorStop(0.5, '#080e22');
        bg.addColorStop(1, '#04060f');
        b.fillStyle = bg;
        b.fillRect(0, 0, size, size);

        // 极光光晕
        const auroras = [
          { x: size * 0.1, y: size * 0.02, r: size * 0.75, c: '138, 107, 255', a: 0.2 },
          { x: size * 0.96, y: size * 0.3, r: size * 0.62, c: '72, 240, 212', a: 0.13 },
          { x: size * 0.45, y: size * 1.02, r: size * 0.7, c: '255, 95, 176', a: 0.1 },
        ];
        for (const au of auroras) {
          const g = b.createRadialGradient(au.x, au.y, 0, au.x, au.y, au.r);
          g.addColorStop(0, 'rgba(' + au.c + ', ' + au.a + ')');
          g.addColorStop(1, 'rgba(' + au.c + ', 0)');
          b.fillStyle = g;
          b.beginPath();
          b.arc(au.x, au.y, au.r, 0, TAU);
          b.fill();
        }

        // 网格
        b.strokeStyle = 'rgba(96, 200, 255, 0.07)';
        b.lineWidth = 1;
        b.beginPath();
        for (let i = 1; i < COLS; i++) {
          const p = Math.round(i * cell) + 0.5;
          b.moveTo(p, 0);
          b.lineTo(p, size);
        }
        for (let j = 1; j < ROWS; j++) {
          const p = Math.round(j * cell) + 0.5;
          b.moveTo(0, p);
          b.lineTo(size, p);
        }
        b.stroke();

        // 主网格线
        b.strokeStyle = 'rgba(110, 230, 255, 0.14)';
        b.beginPath();
        for (let i = 7; i < COLS; i += 7) {
          const p = Math.round(i * cell) + 0.5;
          b.moveTo(p, 0);
          b.lineTo(p, size);
          b.moveTo(0, p);
          b.lineTo(size, p);
        }
        b.stroke();

        // 浮尘
        const rand = mulberry32(0x7c31a5);
        for (let i = 0; i < 70; i++) {
          const x = rand() * size;
          const y = rand() * size;
          const r = 0.5 + rand() * 1.3;
          b.fillStyle = 'rgba(170, 225, 255, ' + (0.1 + rand() * 0.3) + ')';
          b.beginPath();
          b.arc(x, y, r, 0, TAU);
          b.fill();
        }

        // 暗角
        const vig = b.createRadialGradient(size * 0.5, size * 0.46, size * 0.3, size * 0.5, size * 0.5, size * 0.8);
        vig.addColorStop(0, 'rgba(0, 0, 0, 0)');
        vig.addColorStop(1, 'rgba(0, 0, 0, 0.62)');
        b.fillStyle = vig;
        b.fillRect(0, 0, size, size);

        // 顶部冷光
        const top = b.createRadialGradient(size * 0.5, -size * 0.08, 0, size * 0.5, -size * 0.08, size * 0.9);
        top.addColorStop(0, 'rgba(140, 220, 255, 0.12)');
        top.addColorStop(1, 'rgba(140, 220, 255, 0)');
        b.fillStyle = top;
        b.fillRect(0, 0, size, size);
      }

      function shardShape(c, pts) {
        c.beginPath();
        c.moveTo(pts[0].x, pts[0].y);
        for (let i = 1; i < pts.length; i++) {
          c.lineTo(pts[i].x, pts[i].y);
        }
        c.closePath();
      }

      function shardPoints(gx, gy, r) {
        const rand = mulberry32(gx * 73856093 + gy * 19349663 + 7);
        const pts = [];
        const n = 5;
        for (let i = 0; i < n; i++) {
          const a = (i / n) * TAU - Math.PI / 2 + (rand() - 0.5) * 0.34;
          const rad = r * (0.66 + rand() * 0.42);
          pts.push({ x: Math.cos(a) * rad, y: Math.sin(a) * rad * 0.92 });
        }
        return pts;
      }

      function buildRocks() {
        const px = Math.max(1, Math.round(size * dpr));
        rockCache.width = px;
        rockCache.height = px;
        const b = rockCache.getContext('2d');
        b.setTransform(dpr, 0, 0, dpr, 0, 0);
        b.clearRect(0, 0, size, size);
        if (!G.rocks || !G.rocks.size) return;

        G.rocks.forEach((key) => {
          const parts = key.split(',');
          const gx = Number(parts[0]);
          const gy = Number(parts[1]);
          const cx = (gx + 0.5) * cell;
          const cy = (gy + 0.5) * cell;
          const r = cell * 0.46;
          const seed = (gx * 73 + gy * 149) % 100;
          const rot = (seed / 100) * 0.9 - 0.45;

          // 地面光斑
          b.fillStyle = 'rgba(0, 0, 0, 0.5)';
          b.beginPath();
          b.ellipse(cx + cell * 0.06, cy + cell * 0.13, r * 0.92, r * 0.5, 0, 0, TAU);
          b.fill();

          b.save();
          b.translate(cx, cy);
          b.rotate(rot);

          const pts = shardPoints(gx, gy, r);

          // 外发光
          b.shadowColor = 'rgba(120, 240, 255, 0.65)';
          b.shadowBlur = cell * 0.34;

          const g = b.createLinearGradient(-r * 0.6, -r * 0.7, r * 0.6, r * 0.7);
          g.addColorStop(0, '#2e3f80');
          g.addColorStop(0.52, '#1a2350');
          g.addColorStop(1, '#0a0e24');
          b.fillStyle = g;
          shardShape(b, pts);
          b.fill();

          b.shadowBlur = 0;
          b.strokeStyle = 'rgba(130, 245, 255, 0.75)';
          b.lineWidth = 1.4;
          b.stroke();

          // 棱面
          b.beginPath();
          b.moveTo(pts[0].x * 0.2, pts[0].y * 0.2);
          b.lineTo(pts[2].x * 0.92, pts[2].y * 0.92);
          b.strokeStyle = 'rgba(180, 250, 255, 0.28)';
          b.lineWidth = 1;
          b.stroke();

          // 高光
          b.fillStyle = 'rgba(200, 250, 255, 0.22)';
          b.beginPath();
          b.ellipse(-r * 0.22, -r * 0.3, r * 0.18, r * 0.32, -0.5, 0, TAU);
          b.fill();

          b.restore();
        });
      }

      /* ---------------- 游戏状态 ---------------- */

      const G = {
        status: 'idle',       // idle | running | over | clear
        holding: false,
        level: 1,
        levelCfg: LEVELS[0],
        snake: [],
        dir: { x: 1, y: 0 },
        queue: [],
        pred: null,
        rocks: new Set(),
        food: { x: 0, y: 0, sparks: [] },
        eggs: 0,
        target: LEVELS[0].target,
        stepMs: LEVELS[0].step,
        acc: 0,
        levelStart: 0,
        particles: [],
        deathFlash: 0,
        nearMiss: 0,
        steerAxis: null,
        combo: { count: 0, timer: 0 },
      };

      const pointer = { x: 0, y: 0, has: false };
      let activePointerId = null;

      function resizePointer(e) {
        const r = canvas.getBoundingClientRect();
        if (!r.width) return;
        pointer.x = (e.clientX - r.left) * (size / r.width);
        pointer.y = (e.clientY - r.top) * (size / r.height);
        pointer.has = true;
      }

      /* ---------------- 关卡 ---------------- */

      function buildRockSet(level) {
        const cfg = LEVELS[level - 1];
        const rand = mulberry32(0x9e37 + level * 7919);
        const set = new Set();
        let guard = 0;
        const midY = Math.floor(ROWS / 2);

        while (set.size < cfg.rocks && guard++ < 900) {
          const len = 1 + Math.floor(rand() * 3);
          const horiz = rand() > 0.5;
          const x0 = 2 + Math.floor(rand() * (COLS - 4));
          const y0 = 2 + Math.floor(rand() * (ROWS - 4));
          for (let i = 0; i < len; i++) {
            const x = horiz ? x0 + i : x0;
            const y = horiz ? y0 : y0 + i;
            if (x < 1 || x >= COLS - 1 || y < 1 || y >= ROWS - 1) continue;
            if (Math.abs(y - midY) <= 1 && x >= 4 && x <= 12) continue;
            set.add(x + ',' + y);
            if (set.size >= cfg.rocks) break;
          }
        }
        return set;
      }

      function startLevel(n) {
        const level = clamp(n, 1, LEVELS.length);
        const cfg = LEVELS[level - 1];
        G.level = level;
        G.levelCfg = cfg;
        G.target = cfg.target;
        G.eggs = 0;
        G.rocks = buildRockSet(level);
        G.stepMs = cfg.step * speedFactor();
        G.acc = 0;
        G.queue = [];
        G.particles = [];
        G.deathFlash = 0;
        G.nearMiss = 0;
        G.combo = { count: 0, timer: 0 };
        G.steerAxis = null;
        G.levelStart = performance.now();

        const midY = Math.floor(ROWS / 2);
        G.snake = [
          { x: 8, y: midY },
          { x: 7, y: midY },
          { x: 6, y: midY },
        ];
        G.dir = { x: 1, y: 0 };

        placeFood();
        G.pred = nextBody();
        buildRocks();
        updateHud();

        G.status = 'running';
        G.holding = false;
        hideOverlay();
        showHoldHint();
        ensureAudio();
        persist();
      }

      function placeFood() {
        const free = [];
        for (let y = 0; y < ROWS; y++) {
          for (let x = 0; x < COLS; x++) {
            if (G.rocks.has(x + ',' + y)) continue;
            if (G.snake.some((s) => s.x === x && s.y === y)) continue;
            free.push({ x, y });
          }
        }
        if (!free.length) return false;

        const f = free[Math.floor(Math.random() * free.length)];
        f.sparks = [];
        const count = 3 + Math.floor(Math.random() * 3);
        for (let i = 0; i < count; i++) {
          f.sparks.push({
            a: Math.random() * TAU,
            r: 0.62 + Math.random() * 0.5,
            s: 0.6 + Math.random() * 1.2,
          });
        }
        G.food = f;
        return true;
      }

      function updateHud() {
        el.level.textContent = String(G.level).padStart(2, '0');
        el.goal.textContent = G.eggs + '/' + G.target;
        el.bar.style.width = Math.round((G.eggs / Math.max(1, G.target)) * 100) + '%';
        el.stars.textContent = totalStars();
        el.coins.textContent = RET.coins;
      }

      /* ---------------- 推进 ---------------- */

      function nextBody() {
        const head = G.snake[0];
        if (!head) return null;
        const nx = head.x + G.dir.x;
        const ny = head.y + G.dir.y;
        if (nx < 0 || nx >= COLS || ny < 0 || ny >= ROWS) return null;
        if (G.rocks.has(nx + ',' + ny)) return null;

        const grow = nx === G.food.x && ny === G.food.y;
        const body = grow ? G.snake : G.snake.slice(0, -1);
        if (body.some((s) => s.x === nx && s.y === ny)) return null;

        const out = [{ x: nx, y: ny }];
        const keep = grow ? G.snake.length : G.snake.length - 1;
        for (let i = 0; i < keep; i++) out.push({ x: G.snake[i].x, y: G.snake[i].y });
        return out;
      }

      function step() {
        if (G.queue.length) {
          const d = G.queue.shift();
          if (!(d.x === -G.dir.x && d.y === -G.dir.y)) G.dir = d;
        }

        const head = G.snake[0];
        const nx = head.x + G.dir.x;
        const ny = head.y + G.dir.y;

        if (nx < 0 || nx >= COLS || ny < 0 || ny >= ROWS || G.rocks.has(nx + ',' + ny)) {
          die();
          return;
        }

        const grow = nx === G.food.x && ny === G.food.y;
        const body = grow ? G.snake : G.snake.slice(0, -1);
        if (body.some((s) => s.x === nx && s.y === ny)) {
          die();
          return;
        }

        G.snake.unshift({ x: nx, y: ny });

        if (grow) {
          G.eggs += 1;
          RET.coins += Math.max(1, Math.round(streakMultiplier()));
          RET.eggs += 1;
          addMissionProgress('eggs', 1);

          G.combo.count += 1;
          G.combo.timer = 1.6;
          if (G.combo.count >= 3) RET.coins += 1;

          burst(nx, ny);
          sndEat();
          updateHud();

          if (G.eggs >= G.target) {
            clearLevel();
            return;
          }
          if (!placeFood()) {
            clearLevel();
            return;
          }
        } else {
          G.snake.pop();
        }

        if (G.nearMiss < 0.35 && nearMissCheck()) G.nearMiss = 1;
        G.pred = nextBody();
      }

      function nearMissCheck() {
        const head = G.snake[0];
        let danger = false;
        for (let dx = -1; dx <= 1; dx++) {
          for (let dy = -1; dy <= 1; dy++) {
            if (!dx && !dy) continue;
            const x = head.x + dx;
            const y = head.y + dy;
            if (x < 0 || x >= COLS || y < 0 || y >= ROWS) continue;
            if (G.rocks.has(x + ',' + y)) danger = true;
          }
        }
        if (!danger) {
          for (let i = 1; i < G.snake.length; i++) {
            const s = G.snake[i];
            if (Math.abs(s.x - head.x) + Math.abs(s.y - head.y) === 1) { danger = true; break; }
          }
        }
        return danger;
      }

      function calcStars(cfg, seconds) {
        const par = cfg.target * 12 * (cfg.step / 1000);
        if (seconds <= par) return 3;
        if (seconds <= par * 1.65) return 2;
        return 1;
      }

      function clearLevel() {
        G.status = 'clear';
        G.holding = false;
        const seconds = (performance.now() - G.levelStart) / 1000;
        const stars = calcStars(G.levelCfg, seconds);
        const bonus = Math.round((12 + stars * 6) * streakMultiplier());

        RET.coins += bonus;
        RET.clears += 1;
        RET.stars[G.level] = Math.max(RET.stars[G.level] || 0, stars);
        RET.unlocked = Math.max(RET.unlocked, Math.min(LEVELS.length, G.level + 1));
        RET.skill = clamp((RET.skill || 0.35) + 0.05 + (stars - 1) * 0.01, 0.1, 1);

        addMissionProgress('clears', 1);
        addMissionProgress('stars', stars);

        updateHud();
        persist();
        sndWin();
        hideHoldHint();
        renderClearOverlay(stars, seconds, bonus);
      }

      function die() {
        G.status = 'over';
        G.holding = false;
        G.deathFlash = 1;
        G.pred = null;
        RET.skill = clamp((RET.skill || 0.35) - 0.05, 0.1, 1);
        RET.runs += 1;
        persist();
        sndDie();
        hideHoldHint();
        renderOverOverlay();
      }

      /* ---------------- 粒子 ---------------- */

      function burst(cx, cy) {
        const px = (cx + 0.5) * cell;
        const py = (cy + 0.5) * cell;
        const skin = currentSkin();
        for (let i = 0; i < 18; i++) {
          const angle = Math.random() * TAU;
          const speed = cell * (1 + Math.random() * 3.2);
          G.particles.push({
            x: px + (Math.random() - 0.5) * cell * 0.22,
            y: py + (Math.random() - 0.5) * cell * 0.22,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed - cell * 0.2,
            life: 1,
            decay: 1.2 + Math.random() * 0.9,
            size: cell * (0.025 + Math.random() * 0.05),
            rot: Math.random() * TAU,
            spin: (Math.random() - 0.5) * 10,
            color: Math.random() > 0.4 ? '#fff1b8' : skin.gem,
          });
        }
      }

      function updateParticles(dt) {
        for (let i = G.particles.length - 1; i >= 0; i--) {
          const p = G.particles[i];
          p.x += p.vx * dt;
          p.y += p.vy * dt;
          p.vy += cell * 0.9 * dt;
          p.vx *= 0.96;
          p.vy *= 0.96;
          p.rot += p.spin * dt;
          p.life -= p.decay * dt;
          if (p.life <= 0) G.particles.splice(i, 1);
        }
      }

      /* ---------------- 绘制：蛇 ---------------- */

      function smoothPath(points) {
        if (points.length < 3) return points.slice();
        let pts = points;
        for (let pass = 0; pass < 3; pass++) {
          const out = [pts[0]];
          for (let i = 0; i < pts.length - 1; i++) {
            const p = pts[i];
            const q = pts[i + 1];
            out.push({ x: p.x * 0.75 + q.x * 0.25, y: p.y * 0.75 + q.y * 0.25 });
            out.push({ x: p.x * 0.25 + q.x * 0.75, y: p.y * 0.25 + q.y * 0.75 });
          }
          out.push(pts[pts.length - 1]);
          pts = out;
        }
        return pts;
      }

      function bodyRadius(p) {
        const base = cell * 0.315;
        let r = base;
        if (p < 0.1) r *= 0.78 + 0.22 * (p / 0.1);
        if (p > 0.45) {
          const k = (p - 0.45) / 0.55;
          r *= 1 - Math.pow(k, 1.5) * 0.86;
        }
        return Math.max(cell * 0.05, r);
      }

      function resample(points, spacing) {
        if (points.length < 2) return points.slice();
        const out = [points[0]];
        let need = spacing;
        for (let i = 1; i < points.length; i++) {
          const a = points[i - 1];
          const b = points[i];
          const dx = b.x - a.x;
          const dy = b.y - a.y;
          const len = Math.hypot(dx, dy);
          if (len < 1e-6) continue;
          let t = 0;
          while (need <= len - t) {
            t += need;
            out.push({ x: a.x + (dx / len) * t, y: a.y + (dy / len) * t });
            need = spacing;
          }
          need -= len - t;
        }
        const end = points[points.length - 1];
        const last = out[out.length - 1];
        if (Math.hypot(end.x - last.x, end.y - last.y) > spacing * 0.35) out.push(end);
        else out[out.length - 1] = end;
        return out;
      }

      function bodyPoints() {
        const progress = G.status === 'running' ? clamp(G.acc / G.stepMs, 0, 1) : 0;
        const pred = G.pred;
        const source = pred || G.snake;
        const n = pred ? pred.length : G.snake.length;
        const pts = [];
        for (let i = 0; i < n; i++) {
          const to = source[i] || G.snake[i];
          const from = G.snake[i] || to;
          pts.push({
            x: (from.x + (to.x - from.x) * progress + 0.5) * cell,
            y: (from.y + (to.y - from.y) * progress + 0.5) * cell,
          });
        }
        return pts;
      }

      function mix(a, b, t) {
        return [
          Math.round(a[0] + (b[0] - a[0]) * t),
          Math.round(a[1] + (b[1] - a[1]) * t),
          Math.round(a[2] + (b[2] - a[2]) * t),
        ];
      }

      function drawBody(pts) {
        const n = pts.length;
        if (n < 2) return;
        const skin = currentSkin();
        const last = n - 1;

        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        // 地面投影
        ctx.strokeStyle = 'rgba(0, 0, 0, 0.3)';
        for (let i = 1; i < n; i += 2) {
          const p = i / last;
          ctx.lineWidth = bodyRadius(p) * 2;
          ctx.beginPath();
          ctx.moveTo(pts[i - 1].x + cell * 0.05, pts[i - 1].y + cell * 0.1);
          ctx.lineTo(pts[i].x + cell * 0.05, pts[i].y + cell * 0.1);
          ctx.stroke();
        }

        // 霓虹外发光
        ctx.save();
        ctx.globalAlpha = 0.24;
        ctx.strokeStyle = skin.glow;
        for (let i = 1; i < n; i++) {
          const p = i / last;
          ctx.lineWidth = bodyRadius(p) * 2 + 8;
          ctx.beginPath();
          ctx.moveTo(pts[i - 1].x, pts[i - 1].y);
          ctx.lineTo(pts[i].x, pts[i].y);
          ctx.stroke();
        }
        ctx.restore();

        // 深色描边
        ctx.strokeStyle = 'rgba(6, 10, 24, 0.92)';
        for (let i = 1; i < n; i++) {
          const p = i / last;
          ctx.lineWidth = bodyRadius(p) * 2 + 2.6;
          ctx.beginPath();
          ctx.moveTo(pts[i - 1].x, pts[i - 1].y);
          ctx.lineTo(pts[i].x, pts[i].y);
          ctx.stroke();
        }

        // 渐变皮肤
        let dist = 0;
        for (let i = 1; i < n; i++) {
          dist += Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y);
          const p = i / last;
          const band = Math.pow(0.5 + 0.5 * Math.sin((dist / (cell * 1.7)) * TAU), 2);
          const c = mix(skin.lo, skin.hi, 1 - band * 0.72);
          ctx.strokeStyle = 'rgb(' + c[0] + ',' + c[1] + ',' + c[2] + ')';
          ctx.lineWidth = bodyRadius(p) * 2;
          ctx.beginPath();
          ctx.moveTo(pts[i - 1].x, pts[i - 1].y);
          ctx.lineTo(pts[i].x, pts[i].y);
          ctx.stroke();
        }

        // 高光脊线
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.42)';
        ctx.lineWidth = Math.max(1, cell * 0.05);
        ctx.beginPath();
        for (let i = 0; i < n; i++) {
          const x = pts[i].x - cell * 0.02;
          const y = pts[i].y - cell * 0.05;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.stroke();
      }

      function headPath(rx, ry) {
        ctx.beginPath();
        ctx.moveTo(rx * 1.16, 0);
        ctx.quadraticCurveTo(rx * 0.98, ry * 0.66, rx * 0.16, ry);
        ctx.quadraticCurveTo(-rx * 0.5, ry * 0.9, -rx * 0.96, ry * 0.34);
        ctx.quadraticCurveTo(-rx * 1.08, 0, -rx * 0.96, -ry * 0.34);
        ctx.quadraticCurveTo(-rx * 0.5, -ry * 0.9, rx * 0.16, -ry);
        ctx.quadraticCurveTo(rx * 0.98, -ry * 0.66, rx * 1.16, 0);
        ctx.closePath();
      }

      function drawHead(pts, t) {
        const head = pts[0];
        if (!head) return;
        const skin = currentSkin();

        let ang = Math.atan2(G.dir.y, G.dir.x);
        if (pts.length > 2) {
          const nb = pts[Math.min(pts.length - 1, 8)];
          const dx = head.x - nb.x;
          const dy = head.y - nb.y;
          if (Math.hypot(dx, dy) > 1) ang = Math.atan2(dy, dx);
        }

        const c = cell;
        ctx.save();
        ctx.translate(head.x, head.y);
        ctx.rotate(ang);

        // 霓虹光罩
        ctx.save();
        ctx.globalAlpha = 0.5;
        ctx.shadowColor = skin.glow;
        ctx.shadowBlur = c * 0.75;
        ctx.fillStyle = skin.glow;
        headPath(c * 0.6, c * 0.42);
        ctx.fill();
        ctx.restore();

        // 吐信
        const flick = Math.sin(t / 620);
        if (flick > 0.3 && G.status === 'running') {
          const ext = (flick - 0.3) / 0.7;
          const len = c * (0.16 + 0.42 * ext);
          ctx.strokeStyle = 'rgba(255, 110, 170, 0.92)';
          ctx.lineWidth = Math.max(1, c * 0.03);
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(c * 0.5, 0);
          ctx.lineTo(c * 0.5 + len * 0.55, 0);
          ctx.moveTo(c * 0.5 + len * 0.55, 0);
          ctx.lineTo(c * 0.5 + len, -c * 0.07 * ext);
          ctx.moveTo(c * 0.5 + len * 0.55, 0);
          ctx.lineTo(c * 0.5 + len, c * 0.07 * ext);
          ctx.stroke();
        }

        const rx = c * 0.6;
        const ry = c * 0.42;

        // 描边
        ctx.fillStyle = 'rgba(6, 10, 24, 0.95)';
        headPath(rx + 1.8, ry + 1.8);
        ctx.fill();

        // 头部渐变
        const g = ctx.createLinearGradient(0, -ry, 0, ry);
        g.addColorStop(0, skin.head[0]);
        g.addColorStop(0.55, skin.head[1]);
        g.addColorStop(1, skin.head[2]);
        ctx.fillStyle = g;
        headPath(rx, ry);
        ctx.fill();

        // 边缘亮线
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.45)';
        ctx.lineWidth = 1.1;
        headPath(rx, ry);
        ctx.stroke();

        // 顶部光泽
        ctx.fillStyle = 'rgba(255, 255, 255, 0.22)';
        ctx.beginPath();
        ctx.ellipse(c * 0.06, -c * 0.19, c * 0.3, c * 0.1, -0.16, 0, TAU);
        ctx.fill();

        // 眼睛：白眼球 + 彩色虹膜 + 竖瞳
        const eyeR = Math.max(2.6, c * 0.115);
        for (const s of [-1, 1]) {
          const ex = c * 0.1;
          const ey = s * c * 0.27;

          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.ellipse(ex, ey, eyeR * 1.06, eyeR, 0, 0, TAU);
          ctx.fill();

          const ig = ctx.createRadialGradient(ex - eyeR * 0.2, ey - eyeR * 0.2, eyeR * 0.15, ex, ey, eyeR * 0.82);
          ig.addColorStop(0, skin.eye);
          ig.addColorStop(1, skin.head[1]);
          ctx.fillStyle = ig;
          ctx.beginPath();
          ctx.arc(ex, ey, eyeR * 0.8, 0, TAU);
          ctx.fill();

          ctx.fillStyle = '#08101f';
          ctx.beginPath();
          ctx.ellipse(ex, ey, eyeR * 0.24, eyeR * 0.66, 0, 0, TAU);
          ctx.fill();

          ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
          ctx.beginPath();
          ctx.arc(ex - eyeR * 0.3, ey - eyeR * 0.34, eyeR * 0.22, 0, TAU);
          ctx.fill();
        }

        // 鼻孔
        ctx.fillStyle = 'rgba(8, 14, 28, 0.8)';
        for (const s of [-1, 1]) {
          ctx.beginPath();
          ctx.ellipse(c * 0.48, s * c * 0.055, c * 0.024, c * 0.016, 0, 0, TAU);
          ctx.fill();
        }

        ctx.restore();
      }

      /* ---------------- 绘制：能量球 ---------------- */

      function drawFood(t) {
        const c = cell;
        const cx = (G.food.x + 0.5) * c;
        const cy = (G.food.y + 0.5) * c;
        const pulse = 0.5 + 0.5 * Math.sin(t / 300);
        const r = c * (0.2 + 0.03 * pulse);

        // 光晕
        const halo = ctx.createRadialGradient(cx, cy, 0, cx, cy, c * 0.9);
        halo.addColorStop(0, 'rgba(255, 224, 140, 0.5)');
        halo.addColorStop(0.45, 'rgba(255, 196, 80, 0.16)');
        halo.addColorStop(1, 'rgba(255, 196, 80, 0)');
        ctx.fillStyle = halo;
        ctx.beginPath();
        ctx.arc(cx, cy, c * 0.9, 0, TAU);
        ctx.fill();

        // 脉冲环
        ctx.strokeStyle = 'rgba(255, 226, 150, ' + (0.42 - pulse * 0.26) + ')';
        ctx.lineWidth = Math.max(1, c * 0.035);
        ctx.beginPath();
        ctx.arc(cx, cy, c * (0.36 + pulse * 0.16), 0, TAU);
        ctx.stroke();

        // 核心
        const g = ctx.createRadialGradient(cx - r * 0.3, cy - r * 0.35, r * 0.1, cx, cy, r);
        g.addColorStop(0, '#ffffff');
        g.addColorStop(0.42, '#ffe89a');
        g.addColorStop(1, '#f5a623');
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, TAU);
        ctx.fill();

        // 环绕光点
        for (const s of G.food.sparks) {
          const a = t / 900 + s.a;
          const sx = cx + Math.cos(a) * c * s.r * 0.5;
          const sy = cy + Math.sin(a) * c * s.r * 0.42;
          ctx.fillStyle = 'rgba(255, 246, 200, ' + (0.35 + 0.35 * Math.sin(a * 2)) + ')';
          ctx.beginPath();
          ctx.arc(sx, sy, c * 0.028 * s.s, 0, TAU);
          ctx.fill();
        }
      }

      function drawParticles() {
        for (const p of G.particles) {
          if (p.life <= 0) continue;
          ctx.save();
          ctx.globalAlpha = Math.min(1, p.life * 1.4);
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rot);
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.moveTo(-p.size, -p.size * 0.6);
          ctx.lineTo(p.size, 0);
          ctx.lineTo(-p.size, p.size * 0.7);
          ctx.closePath();
          ctx.fill();
          ctx.restore();
        }
        ctx.globalAlpha = 1;
      }

      function draw(t) {
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        if (size > 0) {
          ctx.drawImage(boardCache, 0, 0, size, size);
          ctx.drawImage(rockCache, 0, 0, size, size);
        }
        drawFood(t);
        if (G.snake.length) {
          const pts = resample(smoothPath(bodyPoints()), cell * 0.16);
          drawBody(pts);
          drawHead(pts, t);
        }
        drawParticles();

        if (G.nearMiss > 0) {
          const a = G.nearMiss;
          const grd = ctx.createRadialGradient(size / 2, size / 2, size * 0.34, size / 2, size / 2, size * 0.72);
          grd.addColorStop(0, 'rgba(120, 240, 255, 0)');
          grd.addColorStop(1, 'rgba(120, 240, 255, ' + (0.2 * a) + ')');
          ctx.fillStyle = grd;
          ctx.fillRect(0, 0, size, size);
        }

        if (G.deathFlash > 0) {
          ctx.fillStyle = 'rgba(120, 20, 60, ' + G.deathFlash * 0.34 + ')';
          ctx.fillRect(0, 0, size, size);
        }
      }

      /* ---------------- 覆盖层 ---------------- */

      function setOverlay(html) {
        el.overlay.innerHTML = '<div class="ov-inner">' + html + '</div>';
        el.overlay.classList.remove('hidden');
      }

      function hideOverlay() {
        el.overlay.classList.add('hidden');
      }

      function starsMarkup(n, total) {
        let s = '';
        for (let i = 0; i < total; i++) s += '<span class="' + (i < n ? 'on' : '') + '">★</span>';
        return s;
      }

      function missionsMarkup() {
        return MISSION_DEFS.map((m) => {
          const st = missionState(m);
          const pct = Math.round((st.progress / m.target) * 100);
          return '<div class="mission ' + (st.done ? 'done' : '') + '">' +
            '<span class="mname">' + m.label + '</span>' +
            '<span class="mbar"><i style="width:' + pct + '%"></i></span>' +
            '<span class="mreward">' + (st.done ? '已领' : st.progress + '/' + m.target) + '</span>' +
            '</div>';
        }).join('');
      }

      function renderIdleOverlay() {
        const lv = clamp(RET.unlocked, 1, LEVELS.length);
        const cfg = LEVELS[lv - 1];
        setOverlay(
          '<span class="kicker">neon arcade</span>' +
          '<h1>霓虹贪吃蛇</h1>' +
          '<p>按住画面拖动控制方向，松开暂停。<br>吃掉能量球达成目标即可过关。</p>' +
          '<div class="chips">' +
            '<div class="chip"><span class="ck">连续天数</span><span class="cv">' + RET.streak + '</span></div>' +
            '<div class="chip"><span class="ck">总星数</span><span class="cv">' + totalStars() + '</span></div>' +
            '<div class="chip"><span class="ck">金币</span><span class="cv">' + RET.coins + '</span></div>' +
          '</div>' +
          '<div class="panel"><h2>今日任务 · 连续 ' + RET.streak + ' 天 · 金币 ×' + streakMultiplier().toFixed(1) + '</h2>' + missionsMarkup() + '</div>' +
          '<button class="btn-primary" data-action="play" data-level="' + lv + '">开始第 ' + lv + ' 关 · 目标 ' + cfg.target + '</button>' +
          '<div class="btn-row"><button class="btn-ghost" data-action="select">选关与皮肤</button></div>'
        );
      }

      function renderSelectOverlay() {
        const cells = LEVELS.map((L, i) => {
          const n = i + 1;
          const locked = n > RET.unlocked;
          const st = RET.stars[n] || 0;
          return '<button class="lv ' + (st ? 'done' : '') + '" data-action="play" data-level="' + n + '"' +
            (locked ? ' disabled' : '') + '>' +
            (locked ? '🔒' : String(n).padStart(2, '0')) +
            '<span class="st">' + (locked ? '' : '★'.repeat(st) + '☆'.repeat(3 - st)) + '</span>' +
            '</button>';
        }).join('');

        const skins = SKINS.map((s) => {
          const owned = RET.owned.indexOf(s.id) >= 0;
          const active = RET.skin === s.id;
          return '<button class="skin ' + (active ? 'active' : '') + '" data-action="skin" data-skin="' + s.id + '"' +
            (!owned && RET.coins < s.cost ? ' disabled' : '') + '>' +
            '<i class="sw" style="background:' + s.swatch + ';color:' + s.gem + '"></i>' +
            s.name +
            '<span class="price">' + (active ? '使用中' : owned ? '点击使用' : s.cost + ' 金币') + '</span>' +
            '</button>';
        }).join('');

        setOverlay(
          '<span class="kicker">level select</span>' +
          '<h1>选择关卡</h1>' +
          '<p>已解锁 ' + RET.unlocked + ' / ' + LEVELS.length + ' 关 · 共 ' + totalStars() + ' / ' + (LEVELS.length * 3) + ' 颗星</p>' +
          '<div class="level-grid">' + cells + '</div>' +
          '<div class="panel"><h2>蛇皮商店</h2><div class="shop">' + skins + '</div></div>' +
          '<div class="btn-row"><button class="btn-ghost" data-action="back">返回</button></div>'
        );

      function renderClearOverlay(stars, seconds, bonus) {

        const last = G.level >= LEVELS.length;
        setOverlay(
          '<span class="kicker">level clear</span>' +

            '<div class="chip"><span class="ck">用时</span><span class="cv">' + seconds.toFixed(1) + 's</span></div>' +
            '<div class="chip"><span class="ck">金币</span><span class="cv">+' + bonus + '</span></div>' +
            '<div class="chip"><span class="ck">连续</span><span class="cv">' + RET.streak + '天</span></div>' +
          '</div>' +
          '<div class="panel"><h2>今日任务</h2>' + missionsMarkup() + '</div>' +
          (last
            ? '<button class="btn-primary" data-action="select">查看全部关卡</button>'
            : '<button class="btn-primary" data-action="play" data-level="' + nextLv + '">下一关 · ' + nextLv + '</button>') +
          '<div class="btn-row">' +
            '<button class="btn-ghost" data-action="play" data-level="' + G.level + '">重玩本关</button>' +
            '<button class="btn-ghost" data-action="select">选关</button>' +

        );
      }

      function renderOverOverlay() {
        setOverlay(
          '<span class="kicker">run ended</span>' +
          '<h1>蛇影消散</h1>' +
          '<p>本关目标 ' + G.eggs + '/' + G.target + '，再试一次就能过。</p>' +
          '<div class="chips">' +
            '<div class="chip"><span class="ck">关卡</span><span class="cv">' + G.level + '</span></div>' +
            '<div class="chip"><span class="ck">吃到</span><span class="cv">' + G.eggs + '</span></div>' +
            '<div class="chip"><span class="ck">金币</span><span class="cv">' + RET.coins + '</span></div>' +
          '</div>' +
          '<button class="btn-primary" data-action="play" data-level="' + G.level + '">再试一次</button>' +
          '<div class="btn-row"><button class="btn-ghost" data-action="select">选关</button></div>'
        );
      }

      el.overlay.addEventListener('click', (e) => {
        const btn = e.target.closest('[data-action]');
        if (!btn) return;
        const action = btn.dataset.action;

        if (action === 'play') {
          startLevel(Number(btn.dataset.level) || 1);
        } else if (action === 'select') {
          G.holding = false;
          renderSelectOverlay();
        } else if (action === 'back') {
          renderIdleOverlay();
        } else if (action === 'skin') {
          const s = SKINS.find((x) => x.id === btn.dataset.skin);
          if (!s) return;
          const owned = RET.owned.indexOf(s.id) >= 0;
          if (owned) {
            RET.skin = s.id;
            toast('已切换：' + s.name);
          } else if (RET.coins >= s.cost) {
            RET.coins -= s.cost;
            RET.owned.push(s.id);
            RET.skin = s.id;
            toast('解锁皮肤：' + s.name);
            tone(720, 0.12, 'triangle', 0.09);
          } else {
            toast('金币不足');
            return;
          }
          persist();
          updateHud();
          renderSelectOverlay();
        }
      });

      /* ---------------- 输入：连续转向 + 按住运行 ---------------- */

      function queueDir(dx, dy) {
        if (G.status !== 'running') return;
        const base = G.queue.length ? G.queue[G.queue.length - 1] : G.dir;
        if (dx === base.x && dy === base.y) return;
        if (dx === -base.x && dy === -base.y) return;
        if (G.queue.length >= 2) return;
        G.queue.push({ x: dx, y: dy });
      }

      function updateSteering() {
        if (!G.holding || G.status !== 'running' || !pointer.has) return;
        const head = G.snake[0];
        if (!head) return;

        const hx = (head.x + 0.5) * cell;
        const hy = (head.y + 0.5) * cell;
        const vx = pointer.x - hx;
        const vy = pointer.y - hy;
        if (Math.hypot(vx, vy) < cell * 0.62) return;

        const ax = Math.abs(vx);
        const ay = Math.abs(vy);

        let axis = G.steerAxis;
        if (axis === 'x' && ay > ax * 1.15) axis = 'y';
        else if (axis === 'y' && ax > ay * 1.15) axis = 'x';
        else if (!axis) axis = ax >= ay ? 'x' : 'y';
        G.steerAxis = axis;

        let dx = 0;
        let dy = 0;
        if (axis === 'x') dx = vx > 0 ? 1 : -1;
        else dy = vy > 0 ? 1 : -1;

        const base = G.queue.length ? G.queue[G.queue.length - 1] : G.dir;
        if (dx === base.x && dy === base.y) return;
        if (dx === -base.x && dy === -base.y) return;

        queueDir(dx, dy);
      }

      canvas.addEventListener('pointerdown', (e) => {
        if (e.pointerType === 'mouse' && e.button !== 0) return;
        e.preventDefault();
        activePointerId = e.pointerId;
        resizePointer(e);
        G.steerAxis = null;
        try { canvas.setPointerCapture(e.pointerId); } catch (_) {}

        if (G.status === 'running') {
          G.holding = true;
          hideHoldHint();
        }
      });

      canvas.addEventListener('pointermove', (e) => {
        if (activePointerId !== null && e.pointerId !== activePointerId) return;
        resizePointer(e);
      });

      canvas.addEventListener('pointerup', (e) => {
        if (e.pointerType === 'mouse' && e.button !== 0) return;
        if (activePointerId !== null && e.pointerId !== activePointerId) return;
        activePointerId = null;
        releaseHold();
      });

      canvas.addEventListener('pointercancel', () => {
        activePointerId = null;
        releaseHold();
      });

      canvas.addEventListener('lostpointercapture', () => {
        releaseHold();
      });

      function releaseHold() {
        if (!G.holding) return;
        G.holding = false;
        if (G.status === 'running') showHoldHint();
      }

      function showHoldHint() { el.holdHint.classList.add('show'); }
      function hideHoldHint() { el.holdHint.classList.remove('show'); }

      window.addEventListener('blur', releaseHold);
      document.addEventListener('visibilitychange', () => { if (document.hidden) releaseHold(); });

      window.addEventListener('keydown', (e) => {
        const k = e.key.toLowerCase();
        if (k === 'r') {
          e.preventDefault();
          startLevel(G.level);
        } else if (k === 'escape') {
          e.preventDefault();
          G.holding = false;
          renderSelectOverlay();
        }
      });

      el.restartBtn.addEventListener('click', () => startLevel(G.level));
      el.selectBtn.addEventListener('click', () => {
        G.holding = false;
        renderSelectOverlay();
      });
      el.soundBtn.addEventListener('click', () => {
        soundOn = !soundOn;
        el.soundBtn.textContent = soundOn ? '音效 开' : '音效 关';
        if (soundOn) tone(620, 0.08, 'triangle', 0.08);
      });

      let toastTimer = 0;
      function toast(msg) {
        el.toast.textContent = msg;
        el.toast.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => el.toast.classList.remove('show'), 1800);
      }

      /* ---------------- 主循环 ---------------- */

      let lastT = performance.now();

      function frame(t) {
        const dt = Math.min(0.05, Math.max(0, (t - lastT) / 1000));
        lastT = t;

        if (G.status === 'running' && G.holding) {
          updateSteering();
          G.acc += dt * 1000;
          if (G.acc >= G.stepMs) {
            G.acc -= G.stepMs;
            if (G.acc >= G.stepMs) G.acc = G.stepMs * 0.98;
            step();
            if (G.status !== 'running') G.acc = 0;
          }
        }

        if (G.combo.timer > 0) {
          G.combo.timer -= dt;
          if (G.combo.timer <= 0) G.combo.count = 0;
        }

        updateParticles(dt);
        G.deathFlash = Math.max(0, G.deathFlash - dt * 2.2);
        G.nearMiss = Math.max(0, G.nearMiss - dt * 2.6);

        draw(t);
        requestAnimationFrame(frame);
      }

      /* ---------------- 启动 ---------------- */

      resizeCanvas();
      if (window.ResizeObserver) {
        new ResizeObserver(resizeCanvas).observe(canvas.parentElement);
      } else {
        window.addEventListener('resize', resizeCanvas);
      }

      G.rocks = buildRockSet(1);
      G.pred = null;
      updateHud();
      renderIdleOverlay();
      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
