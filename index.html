<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a120c" />
  <title>林间蛇影 · 贪吃蛇</title>
  <style>
    :root {
      --bg: #0a100b;
      --panel: rgba(24, 32, 22, 0.9);
      --cream: #ece3cc;
      --amber: #e8b96a;
      --moss: #a9c98c;
      --muted: #9aa88c;
      --serif: Georgia, "Songti SC", "Noto Serif SC", "STSong", serif;
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px 14px;
      color: var(--cream);
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
      background:
        radial-gradient(1100px 650px at 50% -12%, rgba(138, 170, 100, 0.13), transparent 62%),
        radial-gradient(900px 600px at 92% 108%, rgba(66, 96, 40, 0.16), transparent 60%),
        radial-gradient(700px 500px at 6% 90%, rgba(40, 60, 30, 0.2), transparent 65%),
        var(--bg);
      overflow-x: hidden;
    }

    .app {
      width: min(100%, 540px);
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 12px;
    }

    .hud {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .hud-item {
      display: flex;
      flex-direction: column;
      gap: 3px;
      padding: 9px 14px;
      border-radius: 14px;
      background: linear-gradient(180deg, rgba(34, 44, 30, 0.92), rgba(18, 25, 17, 0.94));
      border: 1px solid rgba(214, 198, 160, 0.14);
      box-shadow: inset 0 1px 0 rgba(240, 232, 200, 0.07);
    }

    .hud-item .label {
      font-size: 11px;
      letter-spacing: 0.16em;
      color: rgba(196, 196, 164, 0.62);
    }

    .hud-item .value {
      font-family: var(--serif);
      font-size: 22px;
      font-weight: 700;
      line-height: 1.1;
      font-variant-numeric: tabular-nums;
      color: var(--amber);
    }

    .hud-item .value.best { color: var(--moss); }
    .hud-item .value.level { color: var(--cream); }

    .board-wrap {
      position: relative;
      width: min(100%, 520px, max(260px, calc(100dvh - 300px)));
      aspect-ratio: 1 / 1;
      margin: 0 auto;
      border-radius: 20px;
      overflow: hidden;
      background: #131e12;
      box-shadow:
        0 0 0 1px rgba(214, 216, 170, 0.16),
        0 0 0 7px rgba(16, 22, 14, 0.72),
        0 28px 80px -30px rgba(0, 0, 0, 0.9),
        inset 0 0 60px rgba(0, 0, 0, 0.5);
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: crosshair;
      touch-action: none;
    }

    .glass {
      position: absolute;
      inset: 0;
      z-index: 4;
      pointer-events: none;
      background:
        linear-gradient(126deg, rgba(255, 255, 255, 0.09) 0%, rgba(255, 255, 255, 0.025) 24%, rgba(255, 255, 255, 0) 42%),
        radial-gradient(110% 40% at 50% 0%, rgba(255, 255, 255, 0.05), transparent 62%);
    }

    .overlay {
      position: absolute;
      inset: 0;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 24px;
      text-align: center;
      pointer-events: none;
      background: radial-gradient(circle at 50% 44%, rgba(10, 17, 10, 0.82), rgba(4, 7, 4, 0.96));
      -webkit-backdrop-filter: blur(6px);
      backdrop-filter: blur(6px);
      transition: opacity 0.25s ease, visibility 0.25s ease;
    }

    .overlay.hidden {
      opacity: 0;
      visibility: hidden;
    }

    .overlay .kicker {
      font-size: 10px;
      letter-spacing: 0.34em;
      color: rgba(214, 198, 160, 0.55);
      text-transform: uppercase;
    }

    .overlay h1 {
      margin: 2px 0 6px;
      font-family: var(--serif);
      font-size: clamp(26px, 6.4vw, 38px);
      letter-spacing: 0.08em;
      background: linear-gradient(180deg, #f7efd9 12%, #d9a45b 96%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 6px 18px rgba(0, 0, 0, 0.55));
    }

    .overlay p {
      margin: 0;
      max-width: 34ch;
      font-size: 13.5px;
      line-height: 1.75;
      color: rgba(190, 196, 168, 0.78);
    }

    .overlay .tip {
      margin-top: 10px;
      font-size: 12px;
      letter-spacing: 0.18em;
      color: var(--amber);
      animation: breathe 2.6s ease-in-out infinite;
    }

    @keyframes breathe {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 0.92; }
    }

    .hold-hint {
      position: absolute;
      top: 12px;
      left: 50%;
      z-index: 3;
      padding: 6px 16px;
      border-radius: 999px;
      font-size: 12px;
      letter-spacing: 0.1em;
      color: #e9dfc0;
      white-space: nowrap;
      pointer-events: none;
      background: rgba(12, 18, 10, 0.82);
      border: 1px solid rgba(220, 200, 150, 0.28);
      -webkit-backdrop-filter: blur(4px);
      backdrop-filter: blur(4px);
      opacity: 0;
      transform: translate(-50%, -6px);
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .hold-hint.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    .bar {
      display: flex;
      justify-content: center;
      gap: 10px;
    }

    .ghost {
      padding: 8px 18px;
      border: 1px solid rgba(214, 198, 160, 0.22);
      border-radius: 999px;
      background: rgba(28, 36, 24, 0.62);
      color: #d8cfb6;
      font-size: 13px;
      letter-spacing: 0.06em;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
    }

    .ghost:hover {
      background: rgba(56, 70, 42, 0.8);
      border-color: rgba(230, 214, 170, 0.42);
      color: #f3ecd6;
    }

    .hint {
      margin: 0;
      text-align: center;
      font-size: 12px;
      letter-spacing: 0.08em;
      color: rgba(160, 172, 142, 0.72);
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="hud">
      <div class="hud-item">
        <span class="label">得分</span>
        <span class="value" id="score">0</span>
      </div>
      <div class="hud-item">
        <span class="label">最高分</span>
        <span class="value best" id="best">0</span>
      </div>
      <div class="hud-item">
        <span class="label">等级</span>
        <span class="value level" id="level">1</span>
      </div>
    </header>

    <section class="board-wrap">
      <canvas id="game" width="420" height="420" aria-label="草丛中的蛇"></canvas>
      <div class="overlay" id="overlay">
        <span class="kicker">snake in the grass</span>
        <h1 id="ov-title">林间蛇影</h1>
        <p id="ov-desc">按住鼠标拖动控制方向，松开立即暂停。<br />吃掉草丛里的蛇蛋，别撞墙，也别咬到自己。</p>
        <p class="tip" id="ov-tip">按住画面开始游戏</p>
      </div>
      <div class="hold-hint" id="hold-hint">已松开，按住拖动继续</div>
      <div class="glass"></div>
    </section>

    <div class="bar">
      <button class="ghost" id="restart-btn" type="button">重新开始</button>
      <button class="ghost" id="sound-btn" type="button">音效 开</button>
    </div>

    <p class="hint">按住鼠标 / 屏幕滑动转向 · 松开暂停 · R 重开</p>
  </main>

  <script>
    (() => {
      'use strict';

      const COLS = 21;
      const ROWS = 21;
      const BASE_STEP = 150;
      const MIN_STEP = 70;
      const BEST_KEY = 'forest-snake-best';
      const DRAG_THRESHOLD = 20;

      const canvas = document.getElementById('game');
      const ctx = canvas.getContext('2d');

      const els = {
        score: document.getElementById('score'),
        best: document.getElementById('best'),
        level: document.getElementById('level'),
        overlay: document.getElementById('overlay'),
        ovTitle: document.getElementById('ov-title'),
        ovDesc: document.getElementById('ov-desc'),
        ovTip: document.getElementById('ov-tip'),
        holdHint: document.getElementById('hold-hint'),
        restartBtn: document.getElementById('restart-btn'),
        soundBtn: document.getElementById('sound-btn'),
      };

      let best = 0;
      try {
        best = Number(localStorage.getItem(BEST_KEY)) || 0;
      } catch (_) { /* 隐私模式下 localStorage 可能不可用 */ }
      els.best.textContent = best;

      let size = 0;
      let cell = 0;
      let dpr = 1;
      let soundOn = true;
      let anchor = { x: 0, y: 0 };
      let activePointerId = null;

      const boardCache = document.createElement('canvas');

      const G = {
        status: 'idle',        // idle | running | over | win
        holding: false,
        snake: [],
        dir: { x: 1, y: 0 },
        queue: [],
        food: { x: 0, y: 0, spots: [] },
        score: 0,
        stepMs: BASE_STEP,
        acc: 0,
        particles: [],
        deathFlash: 0,
      };

      /* ---------------- 音效 ---------------- */

      let audio = null;

      function ensureAudio() {
        if (audio) return audio;
        try {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (AC) audio = new AC();
        } catch (_) {
          audio = null;
        }
        return audio;
      }

      function tone(freq, dur, type, vol, delay = 0) {
        if (!soundOn) return;
        const ac = ensureAudio();
        if (!ac) return;
        if (ac.state === 'suspended') ac.resume().catch(() => {});
        const t0 = ac.currentTime + delay;
        const osc = ac.createOscillator();
        const gain = ac.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, t0);
        gain.gain.setValueAtTime(0.0001, t0);
        gain.gain.exponentialRampToValueAtTime(vol, t0 + 0.012);
        gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
        osc.connect(gain).connect(ac.destination);
        osc.start(t0);
        osc.stop(t0 + dur + 0.02);
      }

      function sndEat() {
        const base = 560 + Math.random() * 120;
        tone(base, 0.09, 'triangle', 0.09);
        tone(base * 1.5, 0.13, 'sine', 0.05, 0.035);
      }

      function sndDie() {
        tone(170, 0.34, 'sawtooth', 0.11);
        tone(96, 0.5, 'triangle', 0.09, 0.1);
      }

      /* ---------------- 尺寸与场景缓存 ---------------- */

      function resizeCanvas() {
        const wrap = canvas.parentElement;
        const w = wrap.clientWidth;
        if (!w) return;
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        size = w;
        cell = size / COLS;
        canvas.width = Math.round(size * dpr);
        canvas.height = Math.round(size * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        buildScenery();
      }

      function mulberry32(a) {
        return function () {
          a |= 0;
          a = (a + 0x6D2B79F5) | 0;
          let t = Math.imul(a ^ (a >>> 15), 1 | a);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }

      function buildScenery() {
        const px = Math.max(1, Math.round(size * dpr));
        boardCache.width = px;
        boardCache.height = px;
        const b = boardCache.getContext('2d');
        b.setTransform(dpr, 0, 0, dpr, 0, 0);
        b.clearRect(0, 0, size, size);

        const bg = b.createLinearGradient(0, 0, 0, size);
        bg.addColorStop(0, '#22331f');
        bg.addColorStop(0.55, '#1a2a1a');
        bg.addColorStop(1, '#0d1710');
        b.fillStyle = bg;
        b.fillRect(0, 0, size, size);

        const rand = mulberry32(0x51a7e2b);

        // 苔藓光斑
        for (let i = 0; i < 7; i++) {
          const x = rand() * size;
          const y = rand() * size;
          const rad = size * (0.12 + rand() * 0.22);
          const g = b.createRadialGradient(x, y, 0, x, y, rad);
          g.addColorStop(0, 'rgba(120, 160, 90, ' + (0.05 + rand() * 0.06) + ')');
          g.addColorStop(1, 'rgba(120, 160, 90, 0)');
          b.fillStyle = g;
          b.beginPath();
          b.arc(x, y, rad, 0, Math.PI * 2);
          b.fill();
        }

        // 草叶
        const blades = Math.round(size * 1.9);
        for (let i = 0; i < blades; i++) {
          const x = rand() * size;
          const y = rand() * size;
          const len = size * (0.007 + rand() * 0.024);
          const ang = -Math.PI / 2 + (rand() - 0.5) * 1.15;
          const bend = (rand() - 0.5) * len * 0.8;
          const hue = 88 + rand() * 48;
          const sat = 26 + rand() * 26;
          const light = 18 + rand() * 22;
          b.strokeStyle = 'hsla(' + hue + ', ' + sat + '%, ' + light + '%, ' + (0.22 + rand() * 0.32) + ')';
          b.lineWidth = 0.55 + rand() * 1.15;
          b.beginPath();
          b.moveTo(x, y);
          b.quadraticCurveTo(
            x + Math.cos(ang) * len * 0.5 + bend * 0.25,
            y + Math.sin(ang) * len * 0.5,
            x + Math.cos(ang) * len + bend,
            y + Math.sin(ang) * len
          );
          b.stroke();
        }

        // 落叶与草籽
        for (let i = 0; i < 64; i++) {
          const x = rand() * size;
          const y = rand() * size;
          const w = size * (0.0035 + rand() * 0.008);
          const h = w * (1.35 + rand() * 0.9);
          const a = rand() * Math.PI;
          b.fillStyle = 'hsla(' + (58 + rand() * 42) + ', ' + (28 + rand() * 22) + '%, ' + (18 + rand() * 16) + '%, ' + (0.22 + rand() * 0.3) + ')';
          b.beginPath();
          b.ellipse(x, y, w, h, a, 0, Math.PI * 2);
          b.fill();
        }

        // 小碎石
        const stones = 8 + Math.floor(rand() * 5);
        for (let i = 0; i < stones; i++) {
          const x = rand() * size;
          const y = rand() * size;
          const r = size * (0.006 + rand() * 0.012);
          const rot = rand() * Math.PI;

          b.fillStyle = 'rgba(0, 0, 0, 0.2)';
          b.beginPath();
          b.ellipse(x + r * 0.45, y + r * 0.5, r * 1.2, r * 0.8, rot, 0, Math.PI * 2);
          b.fill();

          b.fillStyle = 'rgba(104, 110, 94, 0.55)';
          b.beginPath();
          b.ellipse(x, y, r * 1.15, r * 0.8, rot, 0, Math.PI * 2);
          b.fill();

          b.fillStyle = 'rgba(156, 162, 138, 0.38)';
          b.beginPath();
          b.ellipse(x - r * 0.25, y - r * 0.24, r * 0.45, r * 0.28, rot, 0, Math.PI * 2);
          b.fill();
        }

        // 极淡网格，帮助判断格子
        b.strokeStyle = 'rgba(230, 235, 200, 0.035)';
        b.lineWidth = 1;
        b.beginPath();
        for (let i = 1; i < COLS; i++) {
          const p = Math.round(i * cell) + 0.5;
          b.moveTo(p, 0);
          b.lineTo(p, size);
        }
        for (let j = 1; j < ROWS; j++) {
          const p = Math.round(j * cell) + 0.5;
          b.moveTo(0, p);
          b.lineTo(size, p);
        }
        b.stroke();

        // 暗角
        const vig = b.createRadialGradient(size * 0.5, size * 0.48, size * 0.28, size * 0.5, size * 0.48, size * 0.78);
        vig.addColorStop(0, 'rgba(0, 0, 0, 0)');
        vig.addColorStop(1, 'rgba(0, 0, 0, 0.5)');
        b.fillStyle = vig;
        b.fillRect(0, 0, size, size);

        // 顶部暖光
        const sun = b.createRadialGradient(size * 0.24, -size * 0.05, 0, size * 0.24, -size * 0.05, size * 0.85);
        sun.addColorStop(0, 'rgba(255, 236, 170, 0.13)');
        sun.addColorStop(0.45, 'rgba(255, 236, 170, 0.04)');
        sun.addColorStop(1, 'rgba(255, 236, 170, 0)');
        b.fillStyle = sun;
        b.fillRect(0, 0, size, size);
      }

      /* ---------------- 游戏状态 ---------------- */

      function reset() {
        const midY = Math.floor(ROWS / 2);
        G.snake = [
          { x: 8, y: midY },
          { x: 7, y: midY },
          { x: 6, y: midY },
        ];
        G.dir = { x: 1, y: 0 };
        G.queue = [];
        G.score = 0;
        G.stepMs = BASE_STEP;
        G.acc = 0;
        G.particles = [];
        G.deathFlash = 0;
        placeFood();
        updateHud();
      }

      function placeFood() {
        const free = [];
        for (let y = 0; y < ROWS; y++) {
          for (let x = 0; x < COLS; x++) {
            if (!G.snake.some((s) => s.x === x && s.y === y)) free.push({ x, y });
          }
        }
        if (free.length === 0) return false;

        const f = free[Math.floor(Math.random() * free.length)];
        f.spots = [];
        const count = 4 + Math.floor(Math.random() * 3);
        for (let i = 0; i < count; i++) {
          const a = Math.random() * Math.PI * 2;
          const r = Math.sqrt(Math.random()) * 0.66;
          f.spots.push({
            x: Math.cos(a) * r,
            y: Math.sin(a) * r,
            r: 0.06 + Math.random() * 0.08,
          });
        }
        G.food = f;
        return true;
      }

      function updateHud() {
        els.score.textContent = G.score;
        els.level.textContent = Math.floor(G.score / 50) + 1;
        if (G.score > best) {
          best = G.score;
          els.best.textContent = best;
          try { localStorage.setItem(BEST_KEY, String(best)); } catch (_) {}
        }
      }

      /* ---------------- 单步推进 ---------------- */

      function step() {
        if (G.queue.length) G.dir = G.queue.shift();

        const head = G.snake[0];
        const nx = head.x + G.dir.x;
        const ny = head.y + G.dir.y;

        if (nx < 0 || nx >= COLS || ny < 0 || ny >= ROWS) {
          die();
          return;
        }

        const grow = nx === G.food.x && ny === G.food.y;
        const body = grow ? G.snake : G.snake.slice(0, -1);
        if (body.some((s) => s.x === nx && s.y === ny)) {
          die();
          return;
        }

        G.snake.unshift({ x: nx, y: ny });

        if (grow) {
          G.score += 10;
          const lv = Math.floor(G.score / 50) + 1;
          G.stepMs = Math.max(MIN_STEP, BASE_STEP - (lv - 1) * 12);
          burst(nx, ny);
          sndEat();
          updateHud();
          if (!placeFood()) {
            win();
            return;
          }
        } else {
          G.snake.pop();
        }
      }

      // 提前推演下一步，用于渲染插值：让蛇看起来是连续爬行而不是逐格跳动
      function predictSnake() {
        if (!G.snake.length) return null;
        const dir = G.queue.length ? G.queue[0] : G.dir;
        const head = G.snake[0];
        const nx = head.x + dir.x;
        const ny = head.y + dir.y;
        if (nx < 0 || nx >= COLS || ny < 0 || ny >= ROWS) return null;

        const grow = nx === G.food.x && ny === G.food.y;
        const body = grow ? G.snake : G.snake.slice(0, -1);
        if (body.some((s) => s.x === nx && s.y === ny)) return null;

        const next = [{ x: nx, y: ny }];
        const keep = grow ? G.snake.length : G.snake.length - 1;
        for (let i = 0; i < keep; i++) next.push({ x: G.snake[i].x, y: G.snake[i].y });
        return next;
      }

      function bodyPoints() {
        const pred = G.status === 'running' ? predictSnake() : null;
        const progress = G.status === 'running' ? Math.min(1, G.acc / G.stepMs) : 0;
        const n = pred ? pred.length : G.snake.length;
        const pts = [];
        for (let i = 0; i < n; i++) {
          const to = pred ? pred[i] : G.snake[i];
          const from = G.snake[i] || to;
          pts.push({
            x: (from.x + (to.x - from.x) * progress + 0.5) * cell,
            y: (from.y + (to.y - from.y) * progress + 0.5) * cell,
          });
        }
        return pts;
      }

      /* ---------------- 局面切换 ---------------- */

      function beginGame() {
        if (G.status === 'over' || G.status === 'win') reset();
        G.status = 'running';
        G.holding = true;
        G.acc = 0;
        hideOverlay();
        hideHoldHint();
        ensureAudio();
      }

      function toIdle() {
        reset();
        G.status = 'idle';
        G.holding = false;
        hideHoldHint();
        showOverlay(
          '林间蛇影',
          '按住鼠标拖动控制方向，松开立即暂停。<br />吃掉草丛里的蛇蛋，别撞墙，也别咬到自己。',
          '按住画面开始游戏'
        );
      }

      function releaseHold() {
        if (!G.holding) return;
        G.holding = false;
        if (G.status === 'running') showHoldHint();
      }

      function die() {
        G.status = 'over';
        G.holding = false;
        G.deathFlash = 1;
        hideHoldHint();
        sndDie();
        showOverlay('蛇影消散', '本局得分 ' + G.score + ' · 最高分 ' + best, '按住画面再来一局');
      }

      function win() {
        G.status = 'win';
        G.holding = false;
        hideHoldHint();
        tone(820, 0.18, 'triangle', 0.11);
        tone(1120, 0.24, 'sine', 0.08, 0.12);
        showOverlay('完美通关', '整片草地都被你占满了！得分 ' + G.score, '按住画面再来一局');
      }

      function showOverlay(title, descHTML, tip) {
        els.ovTitle.textContent = title;
        els.ovDesc.innerHTML = descHTML;
        els.ovTip.textContent = tip;
        els.overlay.classList.remove('hidden');
      }

      function hideOverlay() {
        els.overlay.classList.add('hidden');
      }

      function showHoldHint() {
        els.holdHint.classList.add('show');
      }

      function hideHoldHint() {
        els.holdHint.classList.remove('show');
      }

      /* ---------------- 转向 ---------------- */

      function queueDir(dx, dy) {
        if (G.status !== 'running') return;
        const base = G.queue.length ? G.queue[G.queue.length - 1] : G.dir;
        if (dx === base.x && dy === base.y) return;
        if (dx === -base.x && dy === -base.y) return;
        if (G.queue.length >= 2) return;
        G.queue.push({ x: dx, y: dy });
      }

      /* ---------------- 指针控制：按住运行，拖动转向，松开停止 ---------------- */

      canvas.addEventListener('pointerdown', (e) => {
        if (e.pointerType === 'mouse' && e.button !== 0) return;
        e.preventDefault();
        activePointerId = e.pointerId;
        anchor.x = e.clientX;
        anchor.y = e.clientY;
        try { canvas.setPointerCapture(e.pointerId); } catch (_) {}

        if (G.status === 'idle' || G.status === 'over' || G.status === 'win') {
          beginGame();
        } else {
          G.holding = true;
          hideHoldHint();
        }
      });

      canvas.addEventListener('pointermove', (e) => {
        if (!G.holding || G.status !== 'running') return;
        if (activePointerId !== null && e.pointerId !== activePointerId) return;

        const dx = e.clientX - anchor.x;
        const dy = e.clientY - anchor.y;
        if (Math.hypot(dx, dy) < DRAG_THRESHOLD) return;

        if (Math.abs(dx) > Math.abs(dy)) queueDir(dx > 0 ? 1 : -1, 0);
        else queueDir(0, dy > 0 ? 1 : -1);

        anchor.x = e.clientX;
        anchor.y = e.clientY;
      });

      canvas.addEventListener('pointerup', (e) => {
        if (e.pointerType === 'mouse' && e.button !== 0) return;
        if (activePointerId !== null && e.pointerId !== activePointerId) return;
        activePointerId = null;
        releaseHold();
      });

      canvas.addEventListener('pointercancel', () => {
        activePointerId = null;
        releaseHold();
      });

      canvas.addEventListener('lostpointercapture', () => {
        releaseHold();
      });

      window.addEventListener('blur', releaseHold);

      document.addEventListener('visibilitychange', () => {
        if (document.hidden) releaseHold();
      });

      window.addEventListener('keydown', (e) => {
        if (e.key.toLowerCase() === 'r') {
          e.preventDefault();
          toIdle();
        }
      });

      /* ---------------- 按钮 ---------------- */

      els.restartBtn.addEventListener('click', toIdle);

      els.soundBtn.addEventListener('click', () => {
        soundOn = !soundOn;
        els.soundBtn.textContent = soundOn ? '音效 开' : '音效 关';
        if (soundOn) tone(560, 0.08, 'triangle', 0.08);
      });

      /* ---------------- 粒子（蛋壳碎片） ---------------- */

      function burst(cx, cy) {
        const px = (cx + 0.5) * cell;
        const py = (cy + 0.5) * cell;
        for (let i = 0; i < 16; i++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = cell * (0.8 + Math.random() * 2.6);
          G.particles.push({
            x: px + (Math.random() - 0.5) * cell * 0.24,
            y: py + (Math.random() - 0.5) * cell * 0.24,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed - cell * 0.25,
            life: 1,
            decay: 1.1 + Math.random() * 0.9,
            size: cell * (0.03 + Math.random() * 0.05),
            rot: Math.random() * Math.PI * 2,
            spin: (Math.random() - 0.5) * 10,
            cream: Math.random() > 0.35,
          });
        }
      }

      function updateParticles(dt) {
        for (let i = G.particles.length - 1; i >= 0; i--) {
          const p = G.particles[i];
          p.x += p.vx * dt;
          p.y += p.vy * dt;
          p.vy += cell * 1.1 * dt;
          p.vx *= 0.96;
          p.vy *= 0.96;
          p.rot += p.spin * dt;
          p.life -= p.decay * dt;
          if (p.life <= 0) G.particles.splice(i, 1);
        }
      }

      /* ---------------- 绘制：蛇 ---------------- */

      function smoothPath(points) {
        if (points.length < 3) return points.slice();
        let pts = points;
        for (let pass = 0; pass < 2; pass++) {
          const out = [pts[0]];
          for (let i = 0; i < pts.length - 1; i++) {
            const p = pts[i];
            const q = pts[i + 1];
            out.push({ x: p.x * 0.75 + q.x * 0.25, y: p.y * 0.75 + q.y * 0.25 });
            out.push({ x: p.x * 0.25 + q.x * 0.75, y: p.y * 0.25 + q.y * 0.75 });
          }
          out.push(pts[pts.length - 1]);
          pts = out;
        }
        return pts;
      }

      function bodyRadius(p) {
        const base = cell * 0.315;
        let r = base;
        if (p < 0.1) r *= 0.78 + 0.22 * (p / 0.1);
        if (p > 0.45) {
          const k = (p - 0.45) / 0.55;
          r *= 1 - Math.pow(k, 1.5) * 0.86;
        }
        return Math.max(cell * 0.05, r);
      }

      // 沿路径按等间距重采样，消除蛇尾的“串珠”感
      function resample(points, spacing) {
        if (points.length < 2) return points.slice();
        const out = [points[0]];
        let need = spacing;
        for (let i = 1; i < points.length; i++) {
          const a = points[i - 1];
          const b = points[i];
          const dx = b.x - a.x;
          const dy = b.y - a.y;
          const len = Math.hypot(dx, dy);
          if (len < 1e-6) continue;
          let t = 0;
          while (need <= len - t) {
            t += need;
            out.push({ x: a.x + (dx / len) * t, y: a.y + (dy / len) * t });
            need = spacing;
          }
          need -= len - t;
        }
        const end = points[points.length - 1];
        const last = out[out.length - 1];
        if (Math.hypot(end.x - last.x, end.y - last.y) > spacing * 0.35) out.push(end);
        else out[out.length - 1] = end;
        return out;
      }

      function drawBody(pts) {
        const n = pts.length;
        if (n === 0) return;
        const last = Math.max(1, n - 1);

        // 地面投影
        ctx.fillStyle = 'rgba(0, 0, 0, 0.22)';
        for (let i = 0; i < n; i += 2) {
          const p = i / last;
          const r = bodyRadius(p);
          ctx.beginPath();
          ctx.arc(pts[i].x + cell * 0.06, pts[i].y + cell * 0.09, Math.max(1, r), 0, Math.PI * 2);
          ctx.fill();
        }

        // 深色外轮廓
        ctx.fillStyle = 'rgba(34, 19, 9, 0.92)';
        for (let i = 0; i < n; i++) {
          const p = i / last;
          const r = bodyRadius(p) + 1.3;
          ctx.beginPath();
          ctx.arc(pts[i].x, pts[i].y, r, 0, Math.PI * 2);
          ctx.fill();
        }

        // 皮肤与环纹
        let dist = 0;
        for (let i = 0; i < n; i++) {
          if (i > 0) {
            dist += Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y);
          }
          const p = i / last;
          const r = bodyRadius(p);
          const band = Math.pow(0.5 + 0.5 * Math.sin((dist / (cell * 1.55)) * Math.PI * 2), 2.6);
          const cr = Math.round(214 - band * 122);
          const cg = Math.round(158 - band * 94);
          const cb = Math.round(98 - band * 56);
          ctx.fillStyle = 'rgb(' + cr + ',' + cg + ',' + cb + ')';
          ctx.beginPath();
          ctx.arc(pts[i].x, pts[i].y, r, 0, Math.PI * 2);
          ctx.fill();
        }

        // 背脊高光
        ctx.strokeStyle = 'rgba(255, 228, 182, 0.16)';
        ctx.lineWidth = Math.max(1, cell * 0.04);
        ctx.lineJoin = 'round';
        ctx.lineCap = 'round';
        ctx.beginPath();
        for (let i = 0; i < n; i++) {
          const x = pts[i].x - cell * 0.015;
          const y = pts[i].y - cell * 0.032;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.stroke();

        // 鳞片短纹
        ctx.strokeStyle = 'rgba(40, 20, 8, 0.16)';
        ctx.lineWidth = 0.8;
        for (let i = 3; i < n - 3; i += 4) {
          const p = i / last;
          const r = bodyRadius(p);
          const a = Math.atan2(pts[i + 1].y - pts[i - 1].y, pts[i + 1].x - pts[i - 1].x);
          const nx = -Math.sin(a);
          const ny = Math.cos(a);
          for (const s of [-1, 1]) {
            ctx.beginPath();
            ctx.moveTo(pts[i].x + nx * s * r * 0.2, pts[i].y + ny * s * r * 0.2);
            ctx.lineTo(pts[i].x + nx * s * r * 0.8, pts[i].y + ny * s * r * 0.8);
            ctx.stroke();
          }
        }
      }

      function headPath(rx, ry) {
        ctx.beginPath();
        ctx.moveTo(rx * 1.16, 0);
        ctx.quadraticCurveTo(rx * 0.98, ry * 0.66, rx * 0.16, ry);
        ctx.quadraticCurveTo(-rx * 0.5, ry * 0.9, -rx * 0.96, ry * 0.34);
        ctx.quadraticCurveTo(-rx * 1.08, 0, -rx * 0.96, -ry * 0.34);
        ctx.quadraticCurveTo(-rx * 0.5, -ry * 0.9, rx * 0.16, -ry);
        ctx.quadraticCurveTo(rx * 0.98, -ry * 0.66, rx * 1.16, 0);
        ctx.closePath();
      }

      function drawHead(pts, t) {
        const head = pts[0];
        if (!head) return;

        let ang = Math.atan2(G.dir.y, G.dir.x);
        if (pts.length > 1) {
          const nb = pts[Math.min(pts.length - 1, 5)];
          const dx = head.x - nb.x;
          const dy = head.y - nb.y;
          if (Math.hypot(dx, dy) > 1) ang = Math.atan2(dy, dx);
        }

        const c = cell;
        ctx.save();
        ctx.translate(head.x, head.y);
        ctx.rotate(ang);

        // 吐信
        const flick = Math.sin(t / 620);
        if (flick > 0.25) {
          const ext = (flick - 0.25) / 0.75;
          const len = c * (0.16 + 0.44 * ext);
          ctx.strokeStyle = 'rgba(198, 70, 86, 0.9)';
          ctx.lineWidth = Math.max(1, c * 0.028);
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(c * 0.5, 0);
          ctx.lineTo(c * 0.5 + len * 0.55, 0);
          ctx.moveTo(c * 0.5 + len * 0.55, 0);
          ctx.lineTo(c * 0.5 + len, -c * 0.07 * ext);
          ctx.moveTo(c * 0.5 + len * 0.55, 0);
          ctx.lineTo(c * 0.5 + len, c * 0.07 * ext);
          ctx.stroke();
        }

        const rx = c * 0.6;
        const ry = c * 0.42;

        // 头部投影
        ctx.fillStyle = 'rgba(0, 0, 0, 0.22)';
        ctx.beginPath();
        ctx.ellipse(c * 0.05, c * 0.09, c * 0.58, c * 0.39, 0, 0, Math.PI * 2);
        ctx.fill();

        // 外轮廓
        ctx.fillStyle = 'rgba(32, 18, 9, 0.95)';
        headPath(rx + 1.5, ry + 1.5);
        ctx.fill();

        // 头部底色
        const g = ctx.createLinearGradient(0, -ry, 0, ry);
        g.addColorStop(0, '#d39a60');
        g.addColorStop(0.55, '#b97a43');
        g.addColorStop(1, '#855231');
        ctx.fillStyle = g;
        headPath(rx, ry);
        ctx.fill();

        // 头顶深色斑纹
        ctx.fillStyle = 'rgba(88, 46, 22, 0.85)';
        ctx.beginPath();
        ctx.ellipse(c * 0.02, 0, c * 0.3, c * 0.15, 0, 0, Math.PI * 2);
        ctx.fill();
        for (const s of [-1, 1]) {
          ctx.beginPath();
          ctx.ellipse(c * 0.32, s * c * 0.15, c * 0.16, c * 0.042, s * 0.32, 0, Math.PI * 2);
          ctx.fill();
        }

        // 眼睛
        const eyeR = Math.max(2.4, c * 0.105);
        for (const s of [-1, 1]) {
          const ex = c * 0.1;
          const ey = s * c * 0.28;

          ctx.fillStyle = 'rgba(26, 14, 6, 0.92)';
          ctx.beginPath();
          ctx.ellipse(ex, ey, eyeR * 1.32, eyeR * 1.22, 0, 0, Math.PI * 2);
          ctx.fill();

          const ig = ctx.createRadialGradient(ex - eyeR * 0.25, ey - eyeR * 0.25, eyeR * 0.15, ex, ey, eyeR);
          ig.addColorStop(0, '#f7d992');
          ig.addColorStop(1, '#a2682a');
          ctx.fillStyle = ig;
          ctx.beginPath();
          ctx.arc(ex, ey, eyeR, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = '#0d0803';
          ctx.beginPath();
          ctx.ellipse(ex, ey, eyeR * 0.24, eyeR * 0.76, 0, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = 'rgba(255, 255, 255, 0.72)';
          ctx.beginPath();
          ctx.arc(ex - eyeR * 0.32, ey - eyeR * 0.34, eyeR * 0.19, 0, Math.PI * 2);
          ctx.fill();
        }

        // 鼻孔
        ctx.fillStyle = 'rgba(26, 14, 6, 0.85)';
        for (const s of [-1, 1]) {
          ctx.beginPath();
          ctx.ellipse(c * 0.48, s * c * 0.055, c * 0.024, c * 0.016, 0, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.restore();
      }

      /* ---------------- 绘制：蛇蛋与场景 ---------------- */

      function drawFood(t) {
        const c = cell;
        const cx = (G.food.x + 0.5) * c;
        const bob = Math.sin(t / 520) * c * 0.015;
        const rx = c * 0.24;
        const ry = c * 0.3;
        const cy = (G.food.y + 0.5) * c + bob - c * 0.02;

        // 投影
        ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
        ctx.beginPath();
        ctx.ellipse(cx + c * 0.05, cy + ry * 0.94, c * 0.26, c * 0.1, 0, 0, Math.PI * 2);
        ctx.fill();

        // 柔和光晕，让蛋在草丛中更醒目
        const halo = ctx.createRadialGradient(cx, cy, rx * 0.5, cx, cy, rx * 2.6);
        halo.addColorStop(0, 'rgba(255, 240, 196, 0.14)');
        halo.addColorStop(1, 'rgba(255, 240, 196, 0)');
        ctx.fillStyle = halo;
        ctx.beginPath();
        ctx.arc(cx, cy, rx * 2.6, 0, Math.PI * 2);
        ctx.fill();

        // 草窝
        ctx.strokeStyle = 'rgba(136, 158, 92, 0.62)';
        ctx.lineWidth = Math.max(1, c * 0.035);
        for (let i = 0; i < 8; i++) {
          const a = (i / 8) * Math.PI * 2 + 0.35;
          const x1 = cx + Math.cos(a) * rx * 1.34;
          const y1 = cy + Math.sin(a) * ry * 1.14;
          ctx.beginPath();
          ctx.moveTo(x1, y1);
          ctx.quadraticCurveTo(
            x1 + Math.cos(a) * c * 0.11,
            y1 + Math.sin(a) * c * 0.11 - c * 0.05,
            x1 + Math.cos(a) * c * 0.18,
            y1 + Math.sin(a) * c * 0.15 - c * 0.09
          );
          ctx.stroke();
        }

        // 蛋壳描边
        ctx.fillStyle = 'rgba(52, 42, 26, 0.55)';
        ctx.beginPath();
        ctx.ellipse(cx, cy, rx + 1.6, ry + 1.6, 0, 0, Math.PI * 2);
        ctx.fill();

        // 蛋壳
        const g = ctx.createRadialGradient(cx - rx * 0.4, cy - ry * 0.45, rx * 0.18, cx, cy, ry * 1.08);
        g.addColorStop(0, '#fffdf4');
        g.addColorStop(0.6, '#efe1c4');
        g.addColorStop(1, '#c3ae85');
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
        ctx.fill();

        // 斑点
        ctx.fillStyle = 'rgba(116, 90, 56, 0.5)';
        for (const s of G.food.spots) {
          ctx.beginPath();
          ctx.ellipse(cx + s.x * rx, cy + s.y * ry, s.r * rx, s.r * ry * 0.8, 0, 0, Math.PI * 2);
          ctx.fill();
        }

        // 高光
        ctx.fillStyle = 'rgba(255, 255, 255, 0.55)';
        ctx.beginPath();
        ctx.ellipse(cx - rx * 0.35, cy - ry * 0.5, rx * 0.24, ry * 0.12, -0.5, 0, Math.PI * 2);
        ctx.fill();
      }

      function drawParticles() {
        for (const p of G.particles) {
          if (p.life <= 0) continue;
          ctx.save();
          ctx.globalAlpha = Math.min(1, p.life * 1.4);
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rot);
          ctx.fillStyle = p.cream ? '#f3e9d2' : '#e7b45c';
          ctx.beginPath();
          ctx.moveTo(-p.size, -p.size * 0.6);
          ctx.lineTo(p.size, 0);
          ctx.lineTo(-p.size, p.size * 0.7);
          ctx.closePath();
          ctx.fill();
          ctx.restore();
        }
        ctx.globalAlpha = 1;
      }

      function draw(t) {
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        if (size > 0) ctx.drawImage(boardCache, 0, 0, size, size);
        drawFood(t);
        if (G.snake.length) {
          const pts = resample(smoothPath(bodyPoints()), cell * 0.13);
          drawBody(pts);
          drawHead(pts, t);
        }
        drawParticles();
        if (G.deathFlash > 0) {
          ctx.fillStyle = 'rgba(120, 20, 26, ' + G.deathFlash * 0.3 + ')';
          ctx.fillRect(0, 0, size, size);
        }
      }

      /* ---------------- 主循环 ---------------- */

      let lastT = performance.now();

      function frame(t) {
        const dt = Math.min(0.05, Math.max(0, (t - lastT) / 1000));
        lastT = t;

        if (G.status === 'running' && G.holding) {
          G.acc += dt * 1000;
          let guard = 0;
          while (G.acc >= G.stepMs && G.status === 'running' && G.holding && guard++ < 4) {
            G.acc -= G.stepMs;
            step();
          }
          if (G.status !== 'running') G.acc = 0;
        }

        updateParticles(dt);
        G.deathFlash = Math.max(0, G.deathFlash - dt * 2.2);
        draw(t);
        requestAnimationFrame(frame);
      }

      /* ---------------- 启动 ---------------- */

      resizeCanvas();
      if (window.ResizeObserver) {
        new ResizeObserver(resizeCanvas).observe(canvas.parentElement);
      } else {
        window.addEventListener('resize', resizeCanvas);
      }

      toIdle();
      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
